# CIM 全局 ID 注册表 (Global ID Registry)
# 统一所有 Agent 输出的实体标识符
# 版本: 2.0.0 | 生成日期: 2026-04-06
# ID 格式: CIM-{域}-{类型}-{序号}
# 审核修复: 根据审核报告修正 FLOW/CU 域缺失、EQUIP 覆盖率、统计一致性等问题

meta:
  registry_id: "CIM-REGISTRY-20260406"
  version: "2.0.0"
  changelog:
    - {version: "1.0.0", date: "2026-04-05", changes: "初始版本"}
    - {version: "2.0.0", date: "2026-04-06", changes: "审核修复: +FLOW域, +CU域, EQUIP扩展, 实例ID规则, 统计修正"}
  id_pattern: "CIM-{DOMAIN}-{TYPE}-{SEQ}"
  domains:
    TOPO: {prefix: "CIM-TOPO-", source_agent: "Agent-01", description: "拓扑节点与系统"}
    SPACE: {prefix: "CIM-SPACE-", source_agent: "Agent-02", description: "空间层级与分类"}
    EQUIP: {prefix: "CIM-EQUIP-", source_agent: "Agent-03", description: "设备分类与实例"}
    FLOW: {prefix: "CIM-FLOW-", source_agent: "Agent-04", description: "流动路径与介质"}
    CTRL: {prefix: "CIM-CTRL-", source_agent: "Agent-06", description: "控制对象与回路"}
    METER: {prefix: "CIM-METER-", source_agent: "Agent-07", description: "计量点与分配"}
    OM: {prefix: "CIM-OM-", source_agent: "Agent-08", description: "运维管理对象"}
    CU: {prefix: "CIM-CU-", source_agent: "Agent-05", description: "耦合单元与系统依赖"}

  seq_encoding:
    digits: 3
    zero_padded: true
    start_from: "001"
    max_per_type: 999
    overflow_strategy: "扩展为4位"
    examples: ["CIM-EQUIP-CH-001", "CIM-FLOW-MEDIUM-002"]

  instance_id_rules:
    description: "实例化阶段的 ID 生成规范，区别于类型注册表 ID"
    system_instance: "INST-CIM-TOPO-{SYS}-{SPACE}-{SEQ}"
    equipment_instance: "INST-CIM-EQUIP-{TYPE}-{SPACE}-{SEQ}"
    point_instance: "INST-CIM-CTRL-{TYPE}-{SYS}-{PARAM}-{SEQ}"
    meter_instance: "INST-CIM-METER-{ENERGY}-{LEVEL}-{AREA}-{SEQ}"
    examples:
      - {pattern: "INST-CIM-EQUIP-CH-CHP01-001", meaning: "冷冻站1号房间离心冷机001"}
      - {pattern: "INST-CIM-CTRL-SENSOR-HVAC-TEMP-OR001-001", meaning: "OR001温度传感器001"}

