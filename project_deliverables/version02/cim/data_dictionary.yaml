  - {id: EQ-002, label_cn: 可靠性等级, label_en: reliabilityLevel, type: string, values: [LIFE_SAFETY, PATIENT_SAFETY, CRITICAL, IMPORTANT, SECONDARY], class: Equipment, agent: Agent-03}
