  - {id: EQ-019, label_cn: 管道压力等级, label_en: pressureRating, type: decimal, unit: MPa, class: Pipe, agent: Agent-03, note: "设计压力，对应 ISO 6708 压力等级"}
  - {id: EQ-020, label_cn: 流体介质, label_en: flowMedium, type: string, values: [chilled_water, hot_water, condenser_water, oxygen, vacuum, compressed_air, medical_gas, sanitary, supply_air, exhaust_air], class: DistributionComponent, agent: Agent-03, note: "G-04: 用于区分 SV 系统歧义"}
  - {id: EQ-021, label_cn: Revit族引用, label_en: revitFamilyReference, type: string, class: Equipment, agent: Agent-03, ifc_source: "Pset_DistributionFlowElementCommon.Reference", note: "G-01: 用于基于族名的设备类推断"}
