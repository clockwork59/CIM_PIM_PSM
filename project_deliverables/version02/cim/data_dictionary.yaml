# ===================================================================
# 空间域属性 (~50条)
# ===================================================================
space_properties:
  - {id: SP-001, label_cn: 设计温度, label_en: temperature, type: decimal, unit: "°C", range: "16-30", class: Room, agent: Agent-02, standard: "GB 50736"}
  - {id: SP-002, label_cn: 相对湿度, label_en: relativeHumidity, type: decimal, unit: "%RH", range: "20-70", class: Room, agent: Agent-02, standard: "GB 50736"}
  - {id: SP-003, label_cn: 压差, label_en: pressureDifferential, type: decimal, unit: Pa, range: "-30~+30", class: Room, agent: Agent-02, standard: "GB 50333"}
  - {id: SP-004, label_cn: 换气次数, label_en: airChangesPerHour, type: decimal, unit: ACH, range: "2-44", class: Room, agent: Agent-02, standard: "GB 50333"}
  - {id: SP-005, label_cn: 洁净等级, label_en: cleanlinessClass, type: string, values: [ISO-5, ISO-6, ISO-7, ISO-8, standard, minimal], class: CleanSpace, agent: Agent-02}
  - {id: SP-006, label_cn: 噪声水平, label_en: noiseLevel, type: decimal, unit: "dB(A)", range: "30-55", class: Room, agent: Agent-02}
  - {id: SP-007, label_cn: 振动水平, label_en: vibrationLevel, type: decimal, unit: "mm/s", range: "0-0.1", class: Room, agent: Agent-02}
  - {id: SP-008, label_cn: 照度, label_en: illuminance, type: decimal, unit: lx, range: "100-2000", class: Room, agent: Agent-02, standard: "GB 50034"}
  - {id: SP-009, label_cn: 生物危害等级, label_en: biohazardLevel, type: string, values: [BSL-1, BSL-2, BSL-3, BSL-4, none], class: Room, agent: Agent-02}
  - {id: SP-010, label_cn: 感染控制等级, label_en: infectionControlLevel, type: string, values: [strict, critical, enhanced, standard, minimal], class: Room, agent: Agent-02}
  - {id: SP-011, label_cn: 手术室等级, label_en: surgeryGrade, type: string, values: [Class_I, Class_II, Class_III, Class_IV], class: OperatingRoom, agent: Agent-02, standard: "GB 50333"}
  - {id: SP-012, label_cn: 空间层级, label_en: spaceLevel, type: string, values: [L0_Site, L1_Building, L2_Floor, L3_Zone, L4_Room, L5_SubSpace], class: Space, agent: Agent-02}
  - {id: SP-013, label_cn: 区域分类, label_en: zoneClassification, type: string, values: [medical, medical_technology, logistics, public, administrative], class: Zone, agent: Agent-02}
  - {id: SP-014, label_cn: 面积, label_en: areaSqm, type: decimal, unit: "m²", class: Room, agent: Agent-02}
  - {id: SP-015, label_cn: 层高, label_en: ceilingHeightM, type: decimal, unit: m, class: Room, agent: Agent-02}

