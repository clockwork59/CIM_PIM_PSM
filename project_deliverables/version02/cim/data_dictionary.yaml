  - {id: EQ-013, label_cn: 风量, label_en: airFlowRate, type: decimal, unit: "m³/h", class: AHU, agent: Agent-03}
  - {id: EQ-014, label_cn: 扬程, label_en: pumpHead, type: decimal, unit: kPa, class: Pump, agent: Agent-03}
