  - {id: EQ-016, label_cn: 公称直径, label_en: nominalDiameter, type: decimal, unit: mm, class: Pipe, agent: Agent-03, ifc_source: "Pset_PipeConnectionProperties.NominalDiameter", standard: "GB/T 17393"}
  - {id: EQ-017, label_cn: 壁厚, label_en: wallThickness, type: decimal, unit: mm, class: Pipe, agent: Agent-03, ifc_source: "Pset_PipeConnectionProperties.WallThickness"}
