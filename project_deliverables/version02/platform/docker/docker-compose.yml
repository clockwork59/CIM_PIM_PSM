version: "3.8"

services:
  fuseki:
    image: stain/jena-fuseki:4.10.0
    container_name: cim-fuseki
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki
      - ./fuseki-config.ttl:/fuseki/configuration/cim.ttl
    environment:
      ADMIN_PASSWORD: "cim2026"
    restart: unless-stopped

volumes:
  fuseki-data:
