        }

            color: #2563eb;

        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #a8a8a8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }
        .details-summary::-webkit-details-marker { display: none; }
        .details-summary { list-style: none; }
        details .details-content {

            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        details[open] .details-content {
            max-height: 10000px; /* Large enough value */

        }
        details[open] .details-icon { transform: rotate(90deg); }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .dl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem 2rem;
        }

</head>

            const iconMap = {
                'HVAC': `<svg class="${iconClasses}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`,
                'ELEC': `<svg class="${iconClasses}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`,
                'PLUMB': `<svg class="${iconClasses}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9.81 5.93a1 1 0 011.38 1.458l-4.242 4.243a1 1 0 01-1.415-1.414l4.277-4.287zM7 16.5a2.5 2.5 0 115 0 2.5 2.5 0 01-5 0z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M15.5 22a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`,
                'MGAS': `<svg class="${iconClasses}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
                'FIRE': `<svg class="${iconClasses}" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11.68 3.51a1 1 0 011.64 0l6.364 4.077a1 1 0 01.32 1.157l-4.077 6.364a1 1 0 01-1.157.32l-6.364-4.077a1 1 0 01-.32-1.157l4.077-6.364zM16.5 7.5l-9 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`,
                'INT': `<svg class="${iconClasses}" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`,
                'MED': `<svg class="${iconClasses}" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`,
                'O&M': `<svg class="${iconClasses}" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.472-2.472a3.375 3.375 0 00-4.773-4.773L6.75 15.75l2.472 2.472a3.375 3.375 0 004.773-4.773z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`
            };
            return iconMap[category] || `<svg class="${iconClasses}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
        }
        
        function renderSidebar() {
            let html = '<ul class="space-y-1">';
            let isFirstSystem = true;
            for (const batchName in data) {
                const systems = data[batchName];
                const batchId = `batch-${batchKeyToId(batchName)}`;
                html += `
                    <li class="my-1">
                        <button class="w-full text-left px-3 py-2.5 text-sm font-semibold hover:bg-slate-700/50 rounded-md flex justify-between items-center transition-colors duration-200" onclick="toggleBatch('${batchId}')">
                            <span class="truncate">${batchName}</span>
                            <svg id="${batchId}-icon" class="details-icon w-4 h-4 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                        <ul id="${batchId}" class="pl-3 mt-1" style="display: none;">`;
                for (const systemKey in systems) {
                    const system = systems[systemKey];
                    const systemFullId = `${batchKeyToId(batchName)}-${systemKey}`;
                    const activeClass = isFirstSystem ? 'active' : '';
                    html += `
                        <li>
                            <a href="#" id="nav-${systemFullId}" class="sidebar-item flex items-center group px-3 py-2 my-1 rounded-md text-sm hover:bg-slate-700 transition-colors duration-200" 
                                onclick="loadSystem('${batchName}', '${systemKey}', event)">
                                ${getCategoryIcon(system.category)}
                                <span class="flex-grow truncate">${system.name}</span>
                                ${getPriorityBadge(system.priority)}
                            </a>
                        </li>`;
                    if (isFirstSystem) isFirstSystem = false;
                }
                html += '</ul></li>';
            }
            html += '</ul>';
            systemNav.innerHTML = html;
        }

        function batchKeyToId(batchName) { return batchName.split('：')[0].replace(/[^a-zA-Z0-9]/g, ''); }

        function toggleBatch(batchId, forceOpen = false) {
            const ul = document.getElementById(batchId);
            const icon = document.getElementById(`${batchId}-icon`);
            if (!ul) return;
            const isOpen = ul.style.display === 'block';
            if (forceOpen) {
                ul.style.display = 'block';
                if (icon) icon.style.transform = 'rotate(90deg)';
            } else {
                ul.style.display = isOpen ? 'none' : 'block';
                if (icon) icon.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
            }
        }
        
        // --- RENDER HELPER FUNCTIONS ---
        function renderIdentity(section) {
            let html = '<dl class="dl-grid">';
            section.data.forEach(item => {
                html += `<div class="flex flex-col"><dt class="text-sm font-semibold text-gray-500">${item.label}</dt><dd class="mt-1 text-gray-800">${item.value}</dd></div>`;
            });
            return html + '</dl>';
        }

        function renderBoundary(section) {
            let html = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div>
                    <h4 class="font-semibold text-lg text-gray-700 mb-3 border-l-4 border-blue-500 pl-2">输入 (Inputs)</h4>
                    <div class="space-y-3">`;
            (section.data.inputs || []).forEach(input => {
                html += `<div class="p-3 border rounded-lg bg-slate-50 transition-shadow hover:shadow-md">
                            <p class="font-semibold text-slate-800">${input.name}</p>
                            <p class="text-sm text-slate-500">来源: <span class="font-medium text-slate-700">${input.from}</span></p>
                            <p class="text-sm text-slate-500">介质: <span class="font-medium text-slate-700">${input.medium}</span></p>
                            <p class="text-sm text-slate-500">参数: <span class="font-medium text-slate-700">${input.params}</span></p>
                        </div>`;
            });
            html += `</div></div><div>
                    <h4 class="font-semibold text-lg text-gray-700 mb-3 border-l-4 border-red-500 pl-2">输出 (Outputs)</h4>
                    <div class="space-y-3">`;
            (section.data.outputs || []).forEach(output => {
                html += `<div class="p-3 border rounded-lg bg-slate-50 transition-shadow hover:shadow-md">
                            <p class="font-semibold text-slate-800">${output.name}</p>
                            <p class="text-sm text-slate-500">去向: <span class="font-medium text-slate-700">${output.to}</span></p>
                            <p class="text-sm text-slate-500">介质: <span class="font-medium text-slate-700">${output.medium}</span></p>
                            <p class="text-sm text-slate-500">参数: <span class="font-medium text-slate-700">${output.params}</span></p>
                        </div>`;
            });
            html += '</div></div>';
            return html;
        }

        function createTabs(tabsData, parentId) {
            if (!tabsData || tabsData.length === 0) return '<p class="text-gray-500">无详细信息。</p>';
            
            let tabsHtml = `<div class="mb-4 border-b border-gray-200">
                <nav class="-mb-px flex space-x-4" aria-label="Tabs">`;
            tabsData.forEach((tab, index) => {
                tabsHtml += `<button class="tab-button whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm text-gray-500 hover:text-gray-700 hover:border-gray-300 ${index === 0 ? 'active' : ''}" 
                                onclick="switchTab('${parentId}', ${index}, this)">
                                ${tab.name}
                            </button>`;
            });
            tabsHtml += '</nav></div>';

            tabsHtml += '<div>';
            tabsData.forEach((tab, index) => {
                let tabContent = '';
                if(tab.content.type === 'table') {
                    tabContent = `<table class="min-w-full divide-y divide-gray-200 text-sm">
                                    <thead class="bg-gray-50"><tr><th class="px-4 py-2 text-left font-semibold text-gray-600">${tab.content.headers[0]}</th><th class="px-4 py-2 text-left font-semibold text-gray-600">${tab.content.headers[1]}</th></tr></thead>
                                    <tbody class="bg-white divide-y divide-gray-200">`;
                    tab.content.rows.forEach(row => {
                        tabContent += `<tr><td class="px-4 py-2 font-medium text-gray-800">${row[0]}</td><td class="px-4 py-2 text-gray-600">${row[1]}</td></tr>`;
                    });
                    tabContent += '</tbody></table>';
                } else if(tab.content.type === 'points') {
                    tabContent += '<div class="space-y-4">';
                    for(const type in tab.content.points) {
                        tabContent += `<div><h6 class="font-semibold text-gray-700 capitalize">${type}</h6><div class="mt-2 space-y-1">`;
                        tab.content.points[type].forEach(p => {
                            tabContent += `<div class="flex items-center text-xs p-1 rounded bg-gray-50"><span class="font-mono text-indigo-600 w-10">${p.type}</span> <span class="flex-1">${p.name}</span> <span class="text-gray-400">${p.unit || ''}</span></div>`;
                        });
                        tabContent += '</div></div>';
                    }
                    tabContent += '</div>';
                } else {
                    tabContent = `<div class="prose max-w-none text-gray-700 text-sm">${tab.content.text}</div>`;
                }
                
                tabsHtml += `<div class="tab-content ${index > 0 ? 'hidden' : ''}">${tabContent}</div>`;
            });
            tabsHtml += '</div>';
            return tabsHtml;
        }
        
        function renderNodes(section) {
            let html = '<div class="space-y-2">';
            (section.data || []).forEach((node) => {
                const detailsId = `node-${node.id.replace(/[^a-zA-Z0-9]/g, '')}`;
                html += `
                    <details class="bg-slate-50 rounded-lg border border-slate-200" on-toggle="initTabs(this)">
                        <summary class="details-summary p-4 cursor-pointer flex justify-between items-center hover:bg-slate-100 transition-colors">
                            <div class="flex items-center">
                                <svg class="details-icon w-5 h-5 text-gray-500 transition-transform duration-300 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                <div>
                                    <h5 class="font-bold text-lg text-slate-800">${node.name}</h5>
                                    <p class="text-sm text-slate-500 font-mono">${node.id}</p>
                                </div>
                            </div>
                            <span class="text-sm font-semibold text-indigo-600 px-3 py-1 bg-indigo-100 rounded-full">${node.category}</span>
                        </summary>
                        <div class="details-content" id="${detailsId}">
                            <div class="px-4 pb-4 border-t border-slate-200 pt-4 bg-white rounded-b-lg">
                                ${createTabs(node.tabs, detailsId)}
                            </div>
                        </div>
                    </details>`;
            });
            return html + '</div>';
        }

        function renderPaths(section) {
            let html = '<div class="space-y-4">';
            (section.data || []).forEach(path => {
                html += `<div class="p-4 border rounded-lg bg-white">
                            <h5 class="font-semibold text-gray-800">${path.name}</h5>
                            <ol class="mt-2 list-decimal list-inside space-y-1 text-sm text-gray-600">`;
                path.steps.forEach(step => {
                    html += `<li>${step}</li>`;
                });
                html += '</ol></div>';
            });
            return html + '</div>';
        }

        function renderControlLogic(section) {
            let html = '<div class="space-y-4">';
            (section.data || []).forEach(logic => {
                html += `<div class="p-4 border-l-4 border-green-500 bg-green-50/50 rounded-r-lg">
                            <h5 class="font-semibold text-green-800">${logic.name}</h5>
                            <pre class="mt-2 text-sm text-slate-600 bg-white p-3 rounded-md font-mono">${logic.logic}</pre>
                        </div>`;
            });
            return html + '</div>';
        }

        function renderContent(batchName, systemKey) {
            const system = data[batchName]?.[systemKey];
            if (!system) {
                // Should not happen if data is complete
                contentArea.innerHTML = `<div class="bg-white p-8 rounded-lg shadow-md"><h3 class="text-xl font-bold text-gray-700">内容加载失败</h3></div>`;
                return;
            }

            mainTitle.textContent = system.name;
            let anchorNavHtml = '';
            let contentHtml = '';

            if (!system.sections) {
                contentHtml = `<div class="bg-white p-8 rounded-lg shadow-md">
                    <h3 class="text-xl font-bold text-gray-800">${system.name}</h3>
                     <p class="text-gray-500 mt-4">此系统的详细可视化内容正在生成中。以下是基本信息：</p>
                     <ul class="mt-4 space-y-2 text-gray-700">
                        <li><strong class="font-semibold text-gray-900">系统ID:</strong> ${system.id}</li>
                        <li><strong class="font-semibold text-gray-900">优先级:</strong> ${getPriorityBadge(system.priority)}</li>
                        <li><strong class="font-semibold text-gray-900">类别:</strong> ${system.category || 'N/A'}</li>
                     </ul>
                </div>`;
            } else {
                for (const sectionKey in system.sections) {
                    const section = system.sections[sectionKey];
                    anchorNavHtml += `<a href="#${sectionKey}" class="px-3 py-1.5 rounded-md hover:bg-gray-100 transition-colors">${section.title}</a>`;
                    
                    contentHtml += `<div id="${sectionKey}" class="bg-white p-6 rounded-lg shadow-lg mb-8">
                                       <h3 class="text-2xl font-bold text-gray-800 border-b pb-3 mb-6">${section.title}</h3>`;
                    
                    switch(sectionKey) {
                        case 'identity': contentHtml += renderIdentity(section); break;
                        case 'boundary': contentHtml += renderBoundary(section); break;
                        case 'nodes': contentHtml += renderNodes(section); break;
                        case 'typical_paths': contentHtml += renderPaths(section); break;
                        case 'control_logic': contentHtml += renderControlLogic(section); break;
                        default: contentHtml += `<pre class="bg-slate-100 p-4 rounded-md text-sm font-mono">${JSON.stringify(section.data, null, 2)}</pre>`; break;
                    }
                    
                    contentHtml += '</div>';
                }
            }

            contentNav.innerHTML = anchorNavHtml;
            contentArea.innerHTML = contentHtml;
        }

        function switchTab(parentId, tabIndex, buttonElement) {
            const parent = document.getElementById(parentId);
            if (!parent) return;
            parent.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            parent.querySelectorAll('.tab-content').forEach((content, index) => {
                content.classList.toggle('hidden', index !== tabIndex);
            });
        }

        function loadSystem(batchName, systemKey, event) {
            if (event) event.preventDefault();
            
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const systemFullId = `${batchKeyToId(batchName)}-${systemKey}`;
            const navLink = document.getElementById(`nav-${systemFullId}`);
            if (navLink) navLink.classList.add('active');

            renderContent(batchName, systemKey);
            
            if (window.innerWidth < 1024) {
                 sidebar.classList.remove('open');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            
            const firstBatchName = Object.keys(data)[0];
            const firstSystemKey = Object.keys(data[firstBatchName])[0];
            loadSystem(firstBatchName, firstSystemKey);
            toggleBatch(`batch-${batchKeyToId(firstBatchName)}`, true);

            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
            
            // Close sidebar when clicking outside on mobile
            document.addEventListener('click', (event) => {
                if (window.innerWidth < 1024 && sidebar.classList.contains('open')) {
                    if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            });
        });
    </script>
</body>
</html>
