<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="s6" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.14"/>
    </filter>
    <marker id="a6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#37474f"/>
    </marker>
    <marker id="a6w" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fff"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#fafafa"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#212121">端到端数据流: 本体 → 仿真 → API → UI → 报告</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#757575">End-to-End Data Flow — From Ontology to Situation Report</text>

  <!-- ═══ Phase 1: Ontology Foundation ═══ -->
  <rect x="30" y="75" width="170" height="400" rx="10" fill="#1a237e" filter="url(#s6)"/>
  <text x="115" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1 本体基础</text>
  <text x="115" y="116" text-anchor="middle" font-size="10" fill="#9fa8da">CIM Layer</text>

  <rect x="42" y="130" width="146" height="40" rx="6" fill="#e8eaf6"/>
  <text x="115" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1a237e">ontology_skeleton.ttl</text>
  <text x="115" y="162" text-anchor="middle" font-size="9" fill="#3949ab">545 Classes / TBox</text>

  <rect x="42" y="180" width="146" height="40" rx="6" fill="#e8eaf6"/>
  <text x="115" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="#1a237e">nbu_fas_instances.ttl</text>
  <text x="115" y="212" text-anchor="middle" font-size="9" fill="#3949ab">62 FAS 探头 / ABox</text>

  <rect x="42" y="230" width="146" height="40" rx="6" fill="#e8eaf6"/>
  <text x="115" y="248" text-anchor="middle" font-size="10" font-weight="600" fill="#1a237e">nbu_bas_readings_t0.ttl</text>
  <text x="115" y="262" text-anchor="middle" font-size="9" fill="#3949ab">BAS 基线快照</text>

  <rect x="42" y="280" width="146" height="40" rx="6" fill="#e8eaf6"/>
  <text x="115" y="298" text-anchor="middle" font-size="10" font-weight="600" fill="#1a237e">security_event.ttl</text>
  <text x="115" y="312" text-anchor="middle" font-size="9" fill="#3949ab">5 状态 / 26 事件类型</text>

  <rect x="42" y="330" width="146" height="40" rx="6" fill="#e8eaf6"/>
  <text x="115" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="#1a237e">plan_l2_fire.json</text>
  <text x="115" y="362" text-anchor="middle" font-size="9" fill="#3949ab">10 节点 · 依赖 · 角色</text>

  <rect x="42" y="380" width="146" height="40" rx="6" fill="#e8eaf6"/>
  <text x="115" y="398" text-anchor="middle" font-size="10" font-weight="600" fill="#1a237e">shacl_constraints.ttl</text>
  <text x="115" y="412" text-anchor="middle" font-size="9" fill="#3949ab">形状验证规则</text>

  <rect x="42" y="430" width="146" height="30" rx="6" fill="#c5cae9"/>
  <text x="115" y="449" text-anchor="middle" font-size="9" font-weight="600" fill="#1a237e">61,941 RDF Triples</text>

  <!-- ═══ Phase 2: Simulation Engine ═══ -->
  <rect x="220" y="75" width="170" height="400" rx="10" fill="#e65100" filter="url(#s6)"/>
  <text x="305" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2 仿真引擎</text>
  <text x="305" y="116" text-anchor="middle" font-size="10" fill="#ffcc80">Simulation</text>

  <rect x="232" y="130" width="146" height="48" rx="6" fill="#fff3e0"/>
  <text x="305" y="150" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">SimClock</text>
  <text x="305" y="168" text-anchor="middle" font-size="9" fill="#bf360c">t0→t1→t2 时间步进 + 报警注入</text>

  <rect x="232" y="190" width="146" height="48" rx="6" fill="#fff3e0"/>
  <text x="305" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">EventEngine</text>
  <text x="305" y="228" text-anchor="middle" font-size="9" fill="#bf360c">SPARQL 扫描 → 双区确认</text>

  <rect x="232" y="250" width="146" height="48" rx="6" fill="#fff3e0"/>
  <text x="305" y="270" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">EventStateMachine</text>
  <text x="305" y="288" text-anchor="middle" font-size="9" fill="#bf360c">5 状态 · 合法迁移 · 审计</text>

  <rect x="232" y="310" width="146" height="48" rx="6" fill="#fff3e0"/>
  <text x="305" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">ActionChainExecutor</text>
  <text x="305" y="348" text-anchor="middle" font-size="9" fill="#bf360c">拓扑排序 · 并行执行 · 200x</text>

  <rect x="232" y="370" width="146" height="48" rx="6" fill="#fff3e0"/>
  <text x="305" y="390" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">SituationReport</text>
  <text x="305" y="408" text-anchor="middle" font-size="9" fill="#bf360c">KPI + 甘特 + 事件日志</text>

  <rect x="232" y="430" width="146" height="30" rx="6" fill="#ffe0b2"/>
  <text x="305" y="449" text-anchor="middle" font-size="9" font-weight="600" fill="#e65100">840s / 900s = PASS</text>

  <!-- ═══ Phase 3: API Layer ═══ -->
  <rect x="410" y="75" width="170" height="400" rx="10" fill="#1b5e20" filter="url(#s6)"/>
  <text x="495" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3 API 服务</text>
  <text x="495" y="116" text-anchor="middle" font-size="10" fill="#a5d6a7">FastAPI REST</text>

  <rect x="422" y="130" width="146" height="36" rx="6" fill="#e8f5e9"/>
  <text x="495" y="153" text-anchor="middle" font-size="10" font-weight="600" fill="#1b5e20">POST /events (创建)</text>

  <rect x="422" y="175" width="146" height="36" rx="6" fill="#e8f5e9"/>
  <text x="495" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="#1b5e20">POST /confirm (确认)</text>

  <rect x="422" y="220" width="146" height="36" rx="6" fill="#e8f5e9"/>
  <text x="495" y="243" text-anchor="middle" font-size="10" font-weight="600" fill="#1b5e20">POST /complete (完成)</text>

  <rect x="422" y="265" width="146" height="36" rx="6" fill="#e8f5e9"/>
  <text x="495" y="288" text-anchor="middle" font-size="10" font-weight="600" fill="#1b5e20">GET /events (列表)</text>

  <rect x="422" y="310" width="146" height="36" rx="6" fill="#e8f5e9"/>
  <text x="495" y="333" text-anchor="middle" font-size="10" font-weight="600" fill="#1b5e20">GET /events/{id} (详情)</text>

  <rect x="422" y="355" width="146" height="36" rx="6" fill="#e8f5e9"/>
  <text x="495" y="378" text-anchor="middle" font-size="10" font-weight="600" fill="#1b5e20">GET /timeline (时序)</text>

  <rect x="422" y="430" width="146" height="30" rx="6" fill="#c8e6c9"/>
  <text x="495" y="449" text-anchor="middle" font-size="9" font-weight="600" fill="#1b5e20">6 端点 · Port 8001</text>

  <!-- ═══ Phase 4: UI Layer ═══ -->
  <rect x="600" y="75" width="170" height="400" rx="10" fill="#0d47a1" filter="url(#s6)"/>
  <text x="685" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4 交互界面</text>
  <text x="685" y="116" text-anchor="middle" font-size="10" fill="#90caf9">HTML5 Dashboard</text>

  <rect x="612" y="135" width="146" height="60" rx="6" fill="#e3f2fd"/>
  <text x="685" y="157" text-anchor="middle" font-size="10" font-weight="600" fill="#0d47a1">simulate.html</text>
  <text x="685" y="173" text-anchor="middle" font-size="9" fill="#1565c0">3 面板: 报警 / 动作链 / 时序</text>
  <text x="685" y="187" text-anchor="middle" font-size="9" fill="#1565c0">10x 实时 · 双区注入</text>

  <rect x="612" y="205" width="146" height="55" rx="6" fill="#e3f2fd"/>
  <text x="685" y="225" text-anchor="middle" font-size="10" font-weight="600" fill="#0d47a1">index.html</text>
  <text x="685" y="241" text-anchor="middle" font-size="9" fill="#1565c0">指挥中心 · 5 功能面板</text>
  <text x="685" y="253" text-anchor="middle" font-size="9" fill="#1565c0">KPI / BAS / 人员调度</text>

  <rect x="612" y="270" width="146" height="40" rx="6" fill="#e3f2fd"/>
  <text x="685" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#0d47a1">Toast 通知系统</text>
  <text x="685" y="304" text-anchor="middle" font-size="9" fill="#1565c0">成功 / 错误 / 警告 / 信息</text>

  <rect x="612" y="320" width="146" height="40" rx="6" fill="#e3f2fd"/>
  <text x="685" y="340" text-anchor="middle" font-size="10" font-weight="600" fill="#0d47a1">进度条 + KPI 卡片</text>
  <text x="685" y="354" text-anchor="middle" font-size="9" fill="#1565c0">5/10 完成 · 时间合规率</text>

  <!-- ═══ Phase 5: Output ═══ -->
  <rect x="790" y="75" width="145" height="400" rx="10" fill="#4a148c" filter="url(#s6)"/>
  <text x="862" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5 输出产物</text>
  <text x="862" y="116" text-anchor="middle" font-size="10" fill="#ce93d8">Reports</text>

  <rect x="800" y="135" width="125" height="55" rx="6" fill="#f3e5f5"/>
  <text x="862" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#4a148c">simulation_result</text>
  <text x="862" y="170" text-anchor="middle" font-size="9" fill="#7b1fa2">.json · 398 行</text>
  <text x="862" y="183" text-anchor="middle" font-size="9" fill="#7b1fa2">完整执行轨迹</text>

  <rect x="800" y="200" width="125" height="55" rx="6" fill="#f3e5f5"/>
  <text x="862" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#4a148c">situation_report</text>
  <text x="862" y="235" text-anchor="middle" font-size="9" fill="#7b1fa2">.md · 态势报告</text>
  <text x="862" y="248" text-anchor="middle" font-size="9" fill="#7b1fa2">KPI + BAS + 人员</text>

  <rect x="800" y="265" width="125" height="55" rx="6" fill="#f3e5f5"/>
  <text x="862" y="285" text-anchor="middle" font-size="10" font-weight="600" fill="#4a148c">event_timeline</text>
  <text x="862" y="300" text-anchor="middle" font-size="9" fill="#7b1fa2">.md · 甘特图</text>
  <text x="862" y="313" text-anchor="middle" font-size="9" fill="#7b1fa2">[A] 自动 / [M] 人工</text>

  <rect x="800" y="330" width="125" height="55" rx="6" fill="#f3e5f5"/>
  <text x="862" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#4a148c">security_events.ttl</text>
  <text x="862" y="365" text-anchor="middle" font-size="9" fill="#7b1fa2">RDF 事件图谱</text>
  <text x="862" y="378" text-anchor="middle" font-size="9" fill="#7b1fa2">写回 ABox</text>

  <!-- ═══ Flow Arrows ═══ -->
  <!-- Phase 1→2 -->
  <line x1="202" y1="275" x2="218" y2="275" stroke="#fff" stroke-width="3" marker-end="url(#a6w)"/>
  <!-- Phase 2→3 -->
  <line x1="392" y1="275" x2="408" y2="275" stroke="#fff" stroke-width="3" marker-end="url(#a6w)"/>
  <!-- Phase 3→4 -->
  <line x1="582" y1="275" x2="598" y2="275" stroke="#fff" stroke-width="3" marker-end="url(#a6w)"/>
  <!-- Phase 4→5 -->
  <line x1="772" y1="275" x2="788" y2="275" stroke="#fff" stroke-width="3" marker-end="url(#a6w)"/>

  <!-- ═══ Bottom summary ═══ -->
  <rect x="30" y="490" width="900" height="24" rx="6" fill="#e0e0e0"/>
  <text x="480" y="506" text-anchor="middle" font-size="11" fill="#424242" font-weight="600">全链路闭环: 本体 TBox/ABox (CIM) → SimClock 注入 → EventEngine 检测 → ActionChain 执行 → API 推送 → UI 渲染 → 报告归档</text>
</svg>
