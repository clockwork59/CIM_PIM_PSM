<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="s3" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64"/>
    </marker>
    <marker id="a3r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="860" height="380" rx="14" fill="#fafafa"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#212121">SecurityEvent 五状态有限自动机</text>
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#757575">Aligned with cim-se:EventStatus ontology individuals</text>

  <!-- ═══ State Nodes ═══ -->
  <!-- S1: PENDING -->
  <rect x="40" y="120" width="140" height="80" rx="40" fill="#fff9c4" filter="url(#s3)" stroke="#f9a825" stroke-width="2"/>
  <text x="110" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#f57f17">PENDING</text>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#f9a825">待确认</text>

  <!-- S2: CONFIRMED -->
  <rect x="230" y="120" width="140" height="80" rx="40" fill="#ffe0b2" filter="url(#s3)" stroke="#ef6c00" stroke-width="2"/>
  <text x="300" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">CONFIRMED</text>
  <text x="300" y="175" text-anchor="middle" font-size="11" fill="#ef6c00">已确认</text>

  <!-- S3: IN_PROGRESS -->
  <rect x="420" y="120" width="140" height="80" rx="40" fill="#ffcdd2" filter="url(#s3)" stroke="#c62828" stroke-width="2"/>
  <text x="490" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#b71c1c">IN_PROGRESS</text>
  <text x="490" y="170" text-anchor="middle" font-size="11" fill="#c62828">处理中</text>
  <text x="490" y="186" text-anchor="middle" font-size="9" fill="#e53935">L2 预案执行</text>

  <!-- S4: CLOSED -->
  <rect x="610" y="120" width="140" height="80" rx="40" fill="#c8e6c9" filter="url(#s3)" stroke="#2e7d32" stroke-width="2"/>
  <text x="680" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">CLOSED</text>
  <text x="680" y="175" text-anchor="middle" font-size="11" fill="#2e7d32">已闭环</text>

  <!-- S5: ARCHIVED -->
  <rect x="50" y="280" width="140" height="70" rx="35" fill="#e0e0e0" filter="url(#s3)" stroke="#616161" stroke-width="2"/>
  <text x="120" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#424242">ARCHIVED</text>
  <text x="120" y="330" text-anchor="middle" font-size="11" fill="#616161">已归档</text>

  <!-- ═══ Normal Flow Arrows ═══ -->
  <!-- PENDING → CONFIRMED -->
  <line x1="182" y1="160" x2="225" y2="160" stroke="#455a64" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="203" y="148" text-anchor="middle" font-size="9" fill="#455a64" font-weight="600">确认</text>

  <!-- CONFIRMED → IN_PROGRESS -->
  <line x1="372" y1="160" x2="415" y2="160" stroke="#455a64" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="393" y="148" text-anchor="middle" font-size="9" fill="#455a64" font-weight="600">激活</text>

  <!-- IN_PROGRESS → CLOSED -->
  <line x1="562" y1="160" x2="605" y2="160" stroke="#455a64" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="583" y="148" text-anchor="middle" font-size="9" fill="#455a64" font-weight="600">闭环</text>

  <!-- CLOSED → ARCHIVED (dashed, bottom route) -->
  <path d="M 680 202 Q 680 315 195 315" stroke="#455a64" stroke-width="2" fill="none" marker-end="url(#a3)" stroke-dasharray="6,3"/>
  <text x="440" y="305" text-anchor="middle" font-size="9" fill="#455a64" font-weight="600">归档</text>

  <!-- ═══ False Alarm Shortcut ═══ -->
  <path d="M 110 202 L 110 275" stroke="#c62828" stroke-width="2.5" marker-end="url(#a3r)"/>
  <text x="75" y="240" font-size="10" fill="#c62828" font-weight="600">误报</text>
  <text x="68" y="254" font-size="9" fill="#e53935">False Alarm</text>

  <!-- ═══ Trigger annotations ═══ -->
  <!-- Dual-zone auto-confirm -->
  <rect x="155" y="76" width="220" height="28" rx="6" fill="#fff3e0" stroke="#ff8f00" stroke-width="1"/>
  <text x="265" y="95" text-anchor="middle" font-size="10" fill="#e65100">双区30s内触发 → 自动跳至 CONFIRMED</text>
  <line x1="265" y1="105" x2="265" y2="118" stroke="#ff8f00" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- 10-action chain -->
  <rect x="420" y="76" width="140" height="28" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="490" y="95" text-anchor="middle" font-size="10" fill="#c62828">10 动作节点执行</text>
  <line x1="490" y1="105" x2="490" y2="118" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- 10/10 complete -->
  <rect x="610" y="76" width="140" height="28" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="680" y="95" text-anchor="middle" font-size="10" fill="#1b5e20">10/10 完成 → 自动闭环</text>
  <line x1="680" y1="105" x2="680" y2="118" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- ═══ Ontology mapping footer ═══ -->
  <rect x="30" y="355" width="800" height="20" rx="4" fill="#eceff1"/>
  <text x="430" y="369" text-anchor="middle" font-size="10" fill="#546e7a">本体映射: cim-se:StatusPendingConfirmation → cim-se:StatusConfirmed → cim-se:StatusInProgress → cim-se:StatusClosed → cim-se:StatusArchived</text>
</svg>
