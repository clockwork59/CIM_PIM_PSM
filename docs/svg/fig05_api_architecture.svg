<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="s5" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.14"/>
    </filter>
    <marker id="a5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#37474f"/>
    </marker>
    <marker id="a5g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="880" height="480" rx="14" fill="#fafafa"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#212121">MVP API 端点架构与数据流</text>
  <text x="440" y="54" text-anchor="middle" font-size="12" fill="#757575">FastAPI REST — 6 Endpoints · In-Memory State + rdflib Persistence</text>

  <!-- ═══ Client Column ═══ -->
  <rect x="30" y="75" width="160" height="370" rx="10" fill="#e8eaf6" filter="url(#s5)"/>
  <text x="110" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#283593">客户端</text>

  <rect x="45" y="115" width="130" height="45" rx="6" fill="#fff" filter="url(#s5)"/>
  <text x="110" y="136" text-anchor="middle" font-size="11" font-weight="600" fill="#283593">simulate.html</text>
  <text x="110" y="150" text-anchor="middle" font-size="9" fill="#5c6bc0">浏览器 UI</text>

  <rect x="45" y="175" width="130" height="45" rx="6" fill="#fff" filter="url(#s5)"/>
  <text x="110" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#283593">index.html</text>
  <text x="110" y="210" text-anchor="middle" font-size="9" fill="#5c6bc0">指挥中心</text>

  <rect x="45" y="235" width="130" height="45" rx="6" fill="#fff" filter="url(#s5)"/>
  <text x="110" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#283593">curl / httpie</text>
  <text x="110" y="270" text-anchor="middle" font-size="9" fill="#5c6bc0">CLI 测试</text>

  <rect x="45" y="295" width="130" height="45" rx="6" fill="#fff" filter="url(#s5)"/>
  <text x="110" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#283593">Mobile APP</text>
  <text x="110" y="330" text-anchor="middle" font-size="9" fill="#5c6bc0">人员回报 (Future)</text>

  <!-- ═══ API Column ═══ -->
  <rect x="230" y="75" width="340" height="370" rx="10" fill="#e8f5e9" filter="url(#s5)"/>
  <text x="400" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">FastAPI  /mvp/*</text>

  <!-- Endpoint 1: POST /events -->
  <rect x="250" y="115" width="300" height="38" rx="6" fill="#fff" filter="url(#s5)"/>
  <rect x="255" y="120" width="42" height="18" rx="3" fill="#4caf50"/><text x="276" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">POST</text>
  <text x="305" y="134" font-size="11" font-weight="600" fill="#1b5e20">/events</text>
  <text x="420" y="134" font-size="9" fill="#388e3c">注入安全事件 (创建 Event)</text>

  <!-- Endpoint 2: GET /events -->
  <rect x="250" y="162" width="300" height="38" rx="6" fill="#fff" filter="url(#s5)"/>
  <rect x="255" y="167" width="42" height="18" rx="3" fill="#2196f3"/><text x="276" y="181" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GET</text>
  <text x="305" y="181" font-size="11" font-weight="600" fill="#1b5e20">/events</text>
  <text x="420" y="181" font-size="9" fill="#388e3c">列出所有活跃事件</text>

  <!-- Endpoint 3: GET /events/{id} -->
  <rect x="250" y="209" width="300" height="38" rx="6" fill="#fff" filter="url(#s5)"/>
  <rect x="255" y="214" width="42" height="18" rx="3" fill="#2196f3"/><text x="276" y="228" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GET</text>
  <text x="305" y="228" font-size="11" font-weight="600" fill="#1b5e20">/events/{id}</text>
  <text x="442" y="228" font-size="9" fill="#388e3c">事件详情 + 动作进度</text>

  <!-- Endpoint 4: POST /events/{id}/confirm -->
  <rect x="250" y="256" width="300" height="38" rx="6" fill="#fff" filter="url(#s5)"/>
  <rect x="255" y="261" width="42" height="18" rx="3" fill="#4caf50"/><text x="276" y="275" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">POST</text>
  <text x="305" y="275" font-size="11" font-weight="600" fill="#1b5e20">/events/{id}/confirm</text>
  <text x="490" y="275" font-size="9" fill="#388e3c">确认报警</text>

  <!-- Endpoint 5: POST /actions/{id}/complete -->
  <rect x="250" y="303" width="300" height="38" rx="6" fill="#fff" filter="url(#s5)"/>
  <rect x="255" y="308" width="42" height="18" rx="3" fill="#4caf50"/><text x="276" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">POST</text>
  <text x="305" y="322" font-size="11" font-weight="600" fill="#1b5e20">/actions/{id}/complete</text>
  <text x="500" y="322" font-size="9" fill="#388e3c">完成动作</text>

  <!-- Endpoint 6: GET /events/{id}/timeline -->
  <rect x="250" y="350" width="300" height="38" rx="6" fill="#fff" filter="url(#s5)"/>
  <rect x="255" y="355" width="42" height="18" rx="3" fill="#2196f3"/><text x="276" y="369" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GET</text>
  <text x="305" y="369" font-size="11" font-weight="600" fill="#1b5e20">/events/{id}/timeline</text>
  <text x="495" y="369" font-size="9" fill="#388e3c">态势时序</text>

  <!-- Endpoint 7: Root -->
  <rect x="250" y="397" width="300" height="32" rx="6" fill="#f5f5f5" filter="url(#s5)"/>
  <rect x="255" y="401" width="42" height="18" rx="3" fill="#9e9e9e"/><text x="276" y="415" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GET</text>
  <text x="305" y="415" font-size="11" font-weight="600" fill="#616161">/</text>
  <text x="330" y="415" font-size="9" fill="#757575">服务发现 · /docs OpenAPI 文档</text>

  <!-- ═══ State Store Column ═══ -->
  <rect x="610" y="75" width="240" height="370" rx="10" fill="#fff3e0" filter="url(#s5)"/>
  <text x="730" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">状态存储</text>

  <rect x="625" y="120" width="210" height="70" rx="8" fill="#fff" filter="url(#s5)"/>
  <text x="730" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">_events: dict</text>
  <text x="730" y="160" text-anchor="middle" font-size="10" fill="#f57c00">event_id → SecurityEvent 状态</text>
  <text x="730" y="176" text-anchor="middle" font-size="9" fill="#bf360c">state / severity / nodes / timestamps</text>

  <rect x="625" y="205" width="210" height="70" rx="8" fill="#fff" filter="url(#s5)"/>
  <text x="730" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">_action_nodes: dict</text>
  <text x="730" y="245" text-anchor="middle" font-size="10" fill="#f57c00">node_id → ActionNode 状态</text>
  <text x="730" y="261" text-anchor="middle" font-size="9" fill="#bf360c">step / deps / state / completed_by</text>

  <rect x="625" y="290" width="210" height="60" rx="8" fill="#fff" filter="url(#s5)"/>
  <text x="730" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">rdflib.Graph</text>
  <text x="730" y="330" text-anchor="middle" font-size="10" fill="#f57c00">RDF 持久化 → .ttl 文件</text>

  <rect x="625" y="365" width="210" height="60" rx="8" fill="#fff" filter="url(#s5)"/>
  <text x="730" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">L2_PLAN Template</text>
  <text x="730" y="405" text-anchor="middle" font-size="10" fill="#f57c00">10-step 内嵌预案模板</text>

  <!-- ═══ Arrows ═══ -->
  <!-- Client → API -->
  <line x1="178" y1="137" x2="245" y2="134" stroke="#37474f" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="178" y1="197" x2="245" y2="181" stroke="#37474f" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="178" y1="257" x2="245" y2="275" stroke="#37474f" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="178" y1="317" x2="245" y2="322" stroke="#37474f" stroke-width="1.8" marker-end="url(#a5)"/>

  <!-- API → State -->
  <line x1="555" y1="134" x2="620" y2="155" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#a5g)"/>
  <line x1="555" y1="275" x2="620" y2="230" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#a5g)"/>
  <line x1="555" y1="322" x2="620" y2="240" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#a5g)"/>
  <line x1="555" y1="369" x2="620" y2="310" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#a5g)"/>

  <!-- ═══ Footer ═══ -->
  <rect x="30" y="455" width="820" height="20" rx="4" fill="#eceff1"/>
  <text x="440" y="469" text-anchor="middle" font-size="10" fill="#546e7a" font-weight="600">CORS: allow_origins=["*"] · Port: 8001 · Swagger UI: /docs · 零外部数据库依赖 (in-memory + rdflib fallback)</text>
</svg>
