  <rect x="588" y="372" width="22" height="14" rx="3" fill="#1565c0"/><text x="599" y="383" text-anchor="middle" font-size="8" fill="#fff">BAS</text>

  <!-- Arrows: 2→3, 4→5, 4→6 -->
  <line x1="115" y1="313" x2="125" y2="362" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>
  <line x1="295" y1="313" x2="345" y2="362" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>
  <line x1="295" y1="313" x2="545" y2="362" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>

  <!-- ═══ Layer 4: Step 9 (depends on 3) ═══ -->
  <rect x="40" y="465" width="170" height="56" rx="8" fill="#fff3e0" filter="url(#s4)" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="58" y="486" font-size="12" font-weight="700" fill="#e65100">9. 拨打119</text>
  <text x="58" y="504" font-size="10" fill="#f57c00">Manual · 中控值班员 · 120s</text>

  <!-- Arrow: 3→9 -->
  <line x1="125" y1="423" x2="125" y2="462" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>

  <!-- ═══ Legend ═══ -->
  <rect x="640" y="380" width="240" height="140" rx="8" fill="#fff" filter="url(#s4)" stroke="#bdbdbd"/>
  <text x="660" y="402" font-size="12" font-weight="700" fill="#424242">图例</text>
  <rect x="660" y="412" width="40" height="18" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="710" y="426" font-size="10" fill="#424242">Manual — 人工操作 (4个)</text>
  <rect x="660" y="438" width="40" height="18" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="710" y="452" font-size="10" fill="#424242">Auto — 系统自动 (6个)</text>
  <rect x="660" y="464" width="22" height="14" rx="3" fill="#1565c0"/>
  <text x="690" y="476" font-size="10" fill="#424242">BAS 联动指令 (4条)</text>
  <line x1="660" y1="494" x2="690" y2="494" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="700" y="498" font-size="10" fill="#424242">依赖关系 (depends_on)</text>

  <!-- ═══ KPI bar ═══ -->
  <rect x="30" y="535" width="840" height="20" rx="4" fill="#e8f5e9"/>
  <text x="450" y="549" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="600">仿真结果: 10/10 完成 · 总耗时 840s / 900s 限值 = PASS · 4 条 BAS 指令 · 3 角色调度</text>
