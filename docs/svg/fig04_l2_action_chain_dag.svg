  <rect x="260" y="365" width="170" height="56" rx="8" fill="#fff3e0" filter="url(#s4)" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="278" y="386" font-size="12" font-weight="700" fill="#e65100">5. 启动疏散</text>
  <text x="278" y="404" font-size="10" fill="#f57c00">Manual · 保安队长 · 600s</text>

