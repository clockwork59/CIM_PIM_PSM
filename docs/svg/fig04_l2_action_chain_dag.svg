  </defs>

  <rect width="900" height="560" rx="14" fill="#fafafa"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#212121">L2 电气火灾处置预案 — 动作链依赖图 (DAG)</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#757575">PLAN-FIRE-L2-001 v2.1 — 10 Action Nodes with Topological Dependency</text>

  <!-- ═══ Layer 0: Trigger ═══ -->
  <rect x="370" y="75" width="160" height="50" rx="25" fill="#ffcdd2" filter="url(#s4)" stroke="#c62828" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">ALARM TRIGGER</text>
  <text x="450" y="115" text-anchor="middle" font-size="9" fill="#c62828">烟感双区确认 → L2 激活</text>

  <!-- ═══ Layer 1: Step 1 (confirm fire) ═══ -->
  <rect x="360" y="155" width="180" height="56" rx="8" fill="#fff3e0" filter="url(#s4)" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="380" y="176" font-size="12" font-weight="700" fill="#e65100">1. 确认火情</text>
  <text x="380" y="194" font-size="10" fill="#f57c00">Manual · 中控值班员 · 120s</text>

  <!-- Arrow: Trigger → Step 1 -->
  <line x1="450" y1="127" x2="450" y2="152" stroke="#546e7a" stroke-width="2" marker-end="url(#a4)"/>

  <!-- ═══ Layer 2: Steps 2,4,7,8,10 (all depend on 1) ═══ -->
  <!-- Step 2: Cut Power -->
  <rect x="40" y="255" width="150" height="56" rx="8" fill="#e3f2fd" filter="url(#s4)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="58" y="276" font-size="12" font-weight="700" fill="#0d47a1">2. 切断电源</text>
  <text x="58" y="294" font-size="10" fill="#1976d2">Auto · SYSTEM · 30s</text>
  <rect x="158" y="262" width="22" height="14" rx="3" fill="#1565c0"/><text x="169" y="273" text-anchor="middle" font-size="8" fill="#fff">BAS</text>

