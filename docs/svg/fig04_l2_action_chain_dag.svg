  <rect x="220" y="255" width="150" height="56" rx="8" fill="#e3f2fd" filter="url(#s4)" stroke="#1565c0" stroke-width="1.5"/>
  <text x="238" y="276" font-size="12" font-weight="700" fill="#0d47a1">4. 区域广播</text>
  <text x="238" y="294" font-size="10" fill="#1976d2">Auto · SYSTEM · 10s</text>
  <rect x="338" y="262" width="22" height="14" rx="3" fill="#1565c0"/><text x="349" y="273" text-anchor="middle" font-size="8" fill="#fff">BAS</text>

