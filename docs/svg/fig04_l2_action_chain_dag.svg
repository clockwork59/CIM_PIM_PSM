  <line x1="420" y1="213" x2="295" y2="252" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>
  <line x1="450" y1="213" x2="475" y2="252" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>
  <line x1="480" y1="213" x2="655" y2="252" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>
  <line x1="500" y1="213" x2="820" y2="252" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a4)"/>

  <!-- ═══ Layer 3: Steps 3,5,6 (depend on 2 or 4) ═══ -->
  <!-- Step 3: Fire Suppression (depends on 2) -->
  <rect x="40" y="365" width="170" height="56" rx="8" fill="#fff3e0" filter="url(#s4)" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="58" y="386" font-size="12" font-weight="700" fill="#e65100">3. 启动灭火</text>
