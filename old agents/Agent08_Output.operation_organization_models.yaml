    leadership_competencies:
      leadership_influence: "领导力影响"
      decision_making_capability: "决策能力"
      change_management: "变革管理"
      strategic_thinking: "战略思维"
      people_development: "人员发展"
      business_insight: "商业洞察"

  certification_management:
    mandatory_certifications:
      safety_certifications:
        occupational_health_safety: "职业健康安全"
        electrical_safety: "电气安全"
        confined_space_safety: "有限空间作业安全"
        fall_protection: "高处作业安全"
