      - "准备防护设施"
      - "配备火灭器材"
      - "通知消防监护"
      - "移走可燃物质"
      - "采取遮护措施"
      - "作业结束后检查"
      - "得到许可后方可离开"

  medical_facility_safety:
    infection_control_procedures:
