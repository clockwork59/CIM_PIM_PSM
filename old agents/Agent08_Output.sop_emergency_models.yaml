      - "准备工具设备"
      - "安排专业技工"
      - "制定安全措施"
      - "通知相关人员"

    repair_execution:
      - "隔离和锁定设备"
      - "实验安全程序"
      - "按标准程序维修"
      - "更换损坏部件"
      - "调整和校准设备"
      - "进行功能测试"

    verification_completion:
      - "功能和性能测试"
      - "安全装置验证"
      - "清理工作现场"
      - "恢复隔离设施"
      - "记录维修详情"
      - "通知运行部门"

