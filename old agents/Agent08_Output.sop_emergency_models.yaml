# 7. 应急管理预案
emergency_response_procedures:

  power_outage_emergency:
    response_levels:
      level_1_partial:
        description: "局部停电，小于1小时"
        actions:
          - "通知电力公司抢修"
          - "切换备用回路"
          - "通知临床科室"
          - "监控UPS系统"
          - "启动发电机准备"

      level_2_major:
        description: "大面积停电，1-4小时"
        actions:
          - "启动应急预案"
          - "启动备用发电机"
          - "优先保障生命支持设备"
          - "通知医院管理层"
          - "协调各部门响应"
          - "监控发电机运行"

      level_3_extended:
        description: "长时间停电，超过4小时"
        actions:
          - "启动全面应急响应"
          - "联系外部支援"
          - "评估发电机燃料充足"
          - "考虑转移患者"
          - "通知监管部门"
          - "加强关键区域保卫"

    power_restoration:
