# 6. 医疗环境专用SOP
medical_environment_specific_sop:

  cleanroom_operations_sop:
    pre_entry_requirements:
      - "确认洁净室等级和压力梯度"
      - "人员经过洁净室培训"
      - "穿规定洁净服"
      - "通过风淋室或气闸"
      - "携带的工具经过清洁处理"
      - "记录人员进入时间"

    operational_procedures:
      - "作业动作要轻缓，避免搅动大量尘埃"
      - "需要的工具和材料预先准备好"
      - "避免打开过多洁净门"
      - "施工期间监控压差和洁净度"
      - "及时处理产生的废弃材料"
      - "严格遵守规定的清洁程序"

    exit_procedures:
      - "清理工作现场"
      - "清点工具设备"
      - "按程序脱洁净服"
      - "通过风淋或消毒"
      - "记录退出时间"
      - "通知运行人员"

