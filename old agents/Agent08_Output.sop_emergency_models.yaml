        - "使用病床、轮椅转移"
        - "维持生命支持设备"
        - "医护人员陪同"
        - "按预定路线疏散"
        - "在安全区域重新安置"

    medical_special_rescue:
      life_support_maintenance:
        - "用备用电源维持监护"
        - "人工维持呼吸机功能"
        - "确保氧气供应"
        - "持续监测患者状况"
        - "与医疗团队密切配合"

      infection_control:
        during_fire:
          - "维护隔离环境"
          - "防止感染扩散"
          - "转移隔离患者"
          - "维护负压环境"

  medical_gas_emergency:
    oxygen_failure_response:
      immediate_actions:
        - "检查气源供应"
        - "切换到备用气源"
        - "通知医疗人员"
        - "检查关键科室气量"
        - "启动应急供氧"
        - "联系厂家技术支持"

      patient_safety_measures:
        - "医护人员监护维持会呼吸的患者"
        - "使用备用氧气钢瓶"
        - "整理气体供应优先级"
        - "减少非急需用气"
        - "安排患者转运"

    compressed_air_failure:
      emergency_source:
