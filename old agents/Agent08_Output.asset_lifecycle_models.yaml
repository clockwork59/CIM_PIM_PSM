# 资产生命周期模型 - 医疗建筑智能运维管理

# 1. 资产生命周期状态模型
asset_lifecycle_states:

  PLANNING:
    state_code: "PLN"
    name: "规划中"
    description: "资产处于需求规划和技术选型阶段"
    trigger_criteria: "提出新需求或替换需求"
    decision_points: ["需求确认", "可行性研究", "预算批准"]
    time_horizon: "12-36个月"

    planning_activities:
      needs_assessment: "现状评估和差距分析"
      technical_specification: "技术规格制定"
      cost_benefit_analysis: "成本效益分析"
      life_cycle_cost_analysis: "全生命周期成本分析"
      regulatory_compliance_check: "法规合规性检查"
      risk_assessment: "风险评估"
      supplier_prequalification: "供应商资格预审"

    medical_special_considerations:
      patient_care_impact: "对病患护理的影响评估"
      clinical_workflow_integration: "临床工作流程集成分析"
      safety_culture_considerations: "安全文化考量"
      infection_control_impacts: "感染控制影响分析"
      regulatory_approval_paths: "法规审批路径确定"
      clinical_engineering_input: "临床工程意见"

  PROCUREMENT:
    state_code: "PCR"
    name: "采购中"
    description: "资产处于采购、合同、制造阶段"
    trigger_criteria: "规划和预算批准完成"
    decision_points: ["供应商选择", "合同签订", "技术确认"]
    time_horizon: "6-24个月"

    procurement_activities:
      tendering_process: "招标采购程序"
      vendor_selection: "供应商选择"
      contract_negotiation: "合同谈判"
      technical_clarifications: "技术澄清"
      manufacturing_oversight: "制造监督"
      quality_assurance: "质量保证"
      certification_obtainment: "证书获得"
      delivery_scheduling: "交付安排"

    medical_procurement_specials:
      clinical_validation_requirements: "临床验证要求"
      medical_device_regulations: "医疗器械法规"
      supplier_gmp_compliance: "供应商GMP合规"
      clinical_trial_requirements: "临床试用要求"
      regulatory_submission_timeline: "法规提交时间线"
      medical_affairs_involvement: "医学事务参与"

  INSTALLATION:
    state_code: "INS"
    name: "安装中"
    description: "资产处于现场安装和调试阶段"
    trigger_criteria: "设备交付到现场"
    decision_points: ["安装完成", "测试合格", "试运行成功"]
    time_horizon: "1-6个月"

    installation_activities:
      site_preparation: "现场准备工作"
      physical_installation: "设备实体安装"
      utility_connections: "公用工程连接"
      system_integration: "系统集成"
      initial_testing: "初步测试"
      commissioning: "调试投运"
      documentation_handover: "文档移渍"

    medical_installation_requirements:
      infection_control_during_installation: "安装期间感染控制"
      patient_safety_during_installation: "安装期病人安全"
      clinical_staff_training: "临床人员培训"
      infection_prevention_protocols: "感染预防规程"
      facility_readiness_verification: "设施就绪验证"
      regulatory_pre_inspection: "法规预检查"

  COMMISSIONING:
    state_code: "COM"
    name: "调试中"
    description: "资产处于性能验证和最终调试阶段"
    trigger_criteria: "安装工作基本完成"
    decision_points: ["性能验证通过", "安全验收", "商业化运行批准"]
    time_horizon: "2-8周"

    commissioning_activities:
      functional_testing: "功能性测试"
      performance_testing: "性能测试"
      safety_integrity_verification: "安全完整性验证"
      integration_testing: "集成测试"
      operator_training: "操作员培训"
      procedure_finalization: "程序最终确定"
      handover_documentation: "移交文档"

    medical_commissioning_essentials:
      clinical_validation: "临床验证"
      patient_safety_verification: "病人安全验证"
      infection_control_verification: "感染控制验证"
      human_factors_evaluation: "人因工程评估"
      regulatory_acceptance_testing: "法规验收测试"
      healthcare_information_integration: "医疗保健信息集成"

  OPERATIONAL:
    state_code: "OPS"
    name: "运行中"
    description: "资产正常运行，性能满足要求"
    trigger_criteria: "调试完成，投入商业运行"
    decision_points: ["性能衰退", "技术落后", "维护成本过高"]
    time_horizon: "5-25年(依设备类型而定)"

    operational_activities:
      routine_maintenance: "日常维护"
      performance_monitoring: "性能监测"
      efficiency_optimization: "效率优化"
      reliability_improvement: "可靠性改进"
      technology_upgrades: "技术升级"
      compliance_monitoring: "合规性监控"

    medical_operational_requirements:
      continuous_patient_safety_monitoring: "连续的病人安全监测"
      round_the_clock_operation: "24x7运行保障"
      clinical_effectiveness_tracking: "临床有效性跟踪"
      infection_control_maintenance: "感染控制维护"
      medical_device_periodic_hecks: "医疗器械定期检查"
      regulatory_audit_readiness: "法规审核准备"

  MAINTENANCE:
    state_code: "MNT"
    name: "维护中"
    description: "资产处于计划或非计划维护状态"
    trigger_criteria: "进入计划维护期或发生故障"
    decision_points: ["维护完成", "需要大修", "建议退役"]
    time_horizon: "几小时到几个月"

    maintenance_substates:
      planned_maintenance:
        description: "计划性维护"
        planning_horizon: "提前数周到数月"
        impact_management: "对运营的影哏最小化"

      unplanned_maintenance:
        description: "非计划维护"
        response_time: "紧急响应"
        priority_level: "根据严重程度"

      overhaul_maintenance:
        description: "大修"
        comprehensiveness: "深度检修"
        duration: "数周到数月"


    medical_maintenance_specials:
      infection_control_during_maintenance: "维护期间感染控制"
      alternative_patient_care_capacity: "替代病人护理能力"
      medical_device_service_standards: "医疗设备维修标准"
      regulatory_maintenance_documentation: "法规维护文件"
      critical_spare_parts_management: "关键备件管理"
      maintenance_skill_competency_verification: "维护技能验证"

  DEGRADED:
    state_code: "DEG"
    name: "性能下降"
    description: "资产性能开始下降但仍可运行"
    trigger_criteria: "性能指标跌破最低可接受水平"
    decision_points: ["恢复性维护", "升级改造", "加速更换计划"]
    time_horizon: "6个月到2年"

    degradation_indicators:
      performance_decline: "性能下降超过15%"
      efficiency_reduction: "效率降低超过20%"
      reliability_issues: "可靠性问题频繁"
      maintenance_cost_increase: "维护成本显著增加"
      unobtainable_obsolete_parts: "备件获得困难"

    degraded_state_management:
      enhanced_monitoring: "加强监测"
      risk_mitigation: "风险缓解措施"
      alternative_planning: "替代方案规划"
      shortened_planning_horizon: "缩短规划周期"

    medical_degradation_ramifications:
      clinical_quality_degradation: "临床质量下降"
      patient_safety_margin_reduction: "病人安全边界降低"
      regulatory_compliance_challenges: "法规合规挑战"
      infection_control_gap_emergence: "感染控制缺口显现"
      life_cycle_extension_obstacles: "使用寿命延长障碍"

  DECOMMISSIONING:
    state_code: "DCO"
    name: "退役中"
    description: "资产进入退役程序"
    trigger_criteria: "决定退役，启动退役程序"
    decision_points: ["安全拆除", "环境清理", "更换设备投运"]
    time_horizon: "1-12个月"

    decommissioning_activities:
      operational_transition: "运行过渡"
      safe_shutdown: "安全停机"
      hazardous_material_removal: "危险物质清除"
      environmental_restoration: "环境修复"
      documentation_finalization: "文档最终完善"
      asset_disposal: "资产处理"

    medical_decommissioning_requirements:
      patient_care_continuity_assurance: "病人护理连续性保障"
      infection_control_during_transition: "过渡期感染控制"
      medical_device_mandatory_退役ocation: "医疗器械强制性退役通知"
      regulatory_documentation_amendment: "法规文件修订"
      healthcare_数据分析_roaming: "医疗数据迁移"

  RETIRED:
    state_code: "RET"
    name: "已退役"
    description: "资产完成退役，不再用于运行"
    trigger_criteria: "退役程序完成"

    retirement_completion:
      final_documentation: "最终文档齐全"
      asset_removal: "资产完全清除"
      site_restoration: "现场环境恢复"
      records_removal: "记录清除"
      lessons_learned_captured: "经验教训总结"

