# 分类编码规则
classification_coding:
  zone_classification_format: "{ZoneTypeCode}-{SubCategoryCode}"
  room_classification_format: "{CategoryCode}-{TypeCode}"
  examples:
    - "ZM-EM"  # 门诊医疗区-急诊医疗
    - "ID-CT"  # 影像诊断区-CT室
    - "OR-II"  # II级洁净手术室
    - "ICU-SICU"  # 外科重症监护病房
    - "ISR-NG"  # 负压隔离病房
    - "SSR-CSSD"  # 供应室
    - "PHR-PIVAs"  # 静脉用药配置中心

# 分类关系映射
classification_mapping:
  zone_to_room_compatibility:
    "ZM-EM": ["OR-IV", "ISR-NG", "ICU-EICU", "IMG-DR"]  # 急诊区适配房间
    "SR": ["OR-I", "OR-II", "OR-III", "OR-IV"]  # 手术区适配手术室
    "ICU": ["ICU-SICU", "ICU-CICU", "ICU-NICU", "ICU-PICU", "ISR-PP"]  # ICU区适配病房
    "ID": ["IMG-CT", "IMG-MRI", "IMG-DR", "IMG-US", "IMG-NM"]  # 影像区适配房间
    "LP": ["LAB-CLIN", "LAB-BIO", "LAB-PATH", "LAB-MOLE"]  # 检验区适配实验室
    "SSR": ["SSR-SOAK", "SSR-PACK", "SSR-STERILE"]  # 供应室适配房间

  room_to_system_requirements:
    "OR-I": ["HVAC洁净系统", "医疗气体", "UPS电源", "对讲系统", "麻醉废气排放"]
    "ICU": ["独立空调", "医疗气体", "紧急呼叫", "净化水", "远程会诊"]
    "ISR-NG": ["负压系统", "HEPA过滤", "单向气流", "传递窗", "专用卫生间"]
    "PIVAs": ["洁净空调", "超净工作台", "正压环境", "净化水", "监控摄像"]
    "IMG-MRI": ["电磁屏蔽", "设备冷却", "防振动", "UPS供电", "患者通话"]