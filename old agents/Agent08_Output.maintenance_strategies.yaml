# 维护策略模型 - 医疗建筑智能运维管理

# 1. 预防性维护策略（PM）
preventive_maintenance_strategies:

  # 基于时间的预防性维护
  time_based_pm:
    daily_maintenance:
      description: "日常运行检查和监控"
      schedule: "每班次或每日"
      duration: "1-2小时"
      responsible: "运行值班员"
      focus_area: "安全运行和参数监控"

      tasks_performed:
        equipment_operation_check: "设备运行参数检查"
        alarm_status_review: "告警状态确认"
        parameter_recording: "关键参数记录"
        visual_inspection: "目视检查异常"
        cleaning_surface: "表面清洁除尘"
        lubrication_daily: "日润滑部位检查"

      medical_facilities_requirements:
        operating_room_inspection: "手术室环境参数每2小时检查"
        icu_monitoring: "ICU系统连续监控"
        isolation_room_check: "负压病房压差每小时检查"
        emergency_systems: "应急设备状态检查"

    weekly_maintenance:
      description: "周度例行检查保养"
      schedule: "每周固定时间"
      duration: "2-4小时"
      responsible: "多技能技工"
      focus_area: "性能检查和基础保养"

      tasks_performed:
        belt_tension_check: "皮带张紧度检查调整"
        bolt_connection_check: "螺栓连接紧固检查"
        filter_inspection: "过滤器检查，必要时清洁"
        electrical_connection: "电气连接检查"
        bearing_lubrication: "轴承润滑检查补充"
        operation_test: "功能测试验证"
        minor_adjustments: "轻微调整校正"

      medical_specific_tasks:
        air_filter_examination: "医疗环境过滤器检查"
        sterilization_equipment: "消毒设备功能测试"
        medical_gas_systems: "医用气体系统检查"
        cleanroom_integrity: "洁净室完整性检查"

    monthly_maintenance:
      description: "月度深度保养"
      schedule: "每月执行"
      duration: "4-8小时"
      responsible: "专业技工"
      focus_area: "深度清洁和性能优化"

      tasks_performed:
        comprehensive_filter_replacement: "全面过滤器更换"
        coil_cleaning: "盘管深度清洁"
        belt_replacement: "皮带检查更换"
        electrical_testing: "电气安全测试"
        calibration_check: "校准状态检查"
        vibration_check: "振动水平测量"
        leak_detection: "泄漏检测"
        performance_assessment: "性能评估"

      medical_enhancements:
        hepa_filter_validation: "HEPA过滤器检漏"
        pressure_cascade_check: "压差梯度验证"
        infection_control: "感染控制措施检查"
        environmental_monitoring: "环境监测设备校准"

    quarterly_maintenance:
      description: "季度深度保养"
      schedule: "每季度执行"
      duration: "8-16小时"
      responsible: "专业工程师+技工"
      focus_area: "系统性检查和精密维护"

      tasks_performed:
        heat_exchanger_cleaning: "换热器化学清洗"
        motor_insulation_test: "电机绝缘测试"
        control_calibration: "控制回路校准"
        safety_interlock_test: "安全联锁测试"
        comprehensive_efficiency: "综合效率测试"
        wear_assessment: "磨损状况评估"
        belt_drive_overhaul: "皮带传动系统大修"
        electrical_panel_maintenance: "电气柜深度维护"

      medical_systems_focus:
        medical_device_calibration: "医疗设备校准"
        cleanroom_performance: "洁净室性能验证"
        biological_decontamination: "生物去污处理"
        air_changes_verification: "换气次数验证"

    annual_maintenance:
      description: "年度大修"
      schedule: "每年执行或根据制造商建议"
      duration: "1-7天"
      responsible: "专业工程师+厂家技术"
      focus_area: "全面大修和性能恢复"

      tasks_performed:
        major_overhaul: "全面解体大修"
        component_replacement: "关键部件更换"
        performance_restoration: "性能恢复标定"
        safety_system_upgrade: "安全系统升级"
        comprehensive_testing: "综合性能测试"
        documentation_update: "文档记录更新"
        spare_parts_planning: "备件计划制定"
        regulatory_compliance: "合规性检查"

      medical_compliance:
        regulatory_inspection: "法规检查准备"
        certification_renewal: "证书续期"
        third_party_validation: "第三方验证"
        quality_assurance: "质量保证审查"

  # 基于运行周期的预防性维护
  usage_based_pm:
    operating_hours_based:
      2000_hours_service:
        components_affected: ["润滑系统", "过滤器", "密封件"]
        maintenance_tasks: ["润滑油更换", "过滤器更换", "密封检查"]
        duration: "4-8小时"
        skill_level: "技工"

      8000_hours_service:
        components_affected: ["轴承系统", "传动系统", "电气系统"]
        maintenance_tasks: ["轴承检查更换", "传动系统调整", "电气测试"]
        duration: "8-16小时"
        skill_level: "工程师"

      20000_hours_service:
        components_affected: ["压缩机", "主要结构", "控制系统"]
        maintenance_tasks: ["压缩机大修", "主体结构检查", "控制系统升级"]
        duration: "3-7天"
        skill_level: "专业工程师+厂家"

    cycle_based_maintenance:
      startup_cycles: "启停频繁设备按启动次数"
      load_cycles: "循环载荷设备按载荷循环"
      operation_modes: "不同运行模式差异化维护"
      environmental_factors: "环境恶劣程度调整维护频率"

    condition_adjusted_pm:
      vibration_based: "振动监测调整维护时机"
      temperature_based: "温度水平调整维护间隔"
      corrosion_based: "腐蚀监测调整防腐维护"
      contamination_based: "污染程度调整清洁维护"

# 2. 预测性维护策略（PdM）
predictive_maintenance_strategies:

  # 基于状态监测的预测
  condition_based_pd:
    vibration_analysis:
      monitoring_objects:
        - "旋转机械(水泵、风机、冷机等)"
        - "轴承系统"
        - "传动系统"
      diagnostic_technology:
        - "频谱分析"
        - "包络分析"
        - "时域分析"
        - "趋势分析"
      fault_detection:
        - "不平衡"
        - "不对中"
        - "轴承故障"
        - "齿轮故障"
        - "松动"
      predictive_indicators:
        - "振动烈度趋势"
        - "特征频率幅值"
        - "峭度因子"
        - "峰值因子"

      medical_applications:
        hvac_rotating_equipment: "暖通空调旋转设备"
        medical_gas_compressors: "医用气体压缩机"
        vacuum_pumps: "真空泵"
        sterilization_equipment: "消毒设备"

    thermal_analysis:
      monitoring_objects:
        - "电气设备"
        - "机械设备"
        - "热能系统"
        - "管道系统"
      diagnostic_technology:
        - "红外热像"
        - "温度趋势"
        - "热点检测"
        - "温差分析"
      fault_detection:
        - "电气故障"
        - "机械磨损"
        - "绝缘老化"
        - "接触不良"
        - "过载运行"
      predictive_indicators:
        - "温度梯度"
        - "热点温度"
        - "温升趋势"
        - "相对温差"

      medical_critical_points:
        electrical_distribution: "配电系统热点"
        medical_equipment_cabinet: "医疗设备配电柜"
        ups_transformers: "UPS和变压器"
        control_panels: "控制柜"

    electrical_analysis:
      monitoring_objects:
        - "电机系统"
        - "电气绝缘"
        - "电能质量"
        - "控制回路"
      diagnostic_technology:
        - "电机电流分析"
        - "绝缘阻抗测试"
        - "局部放电检测"
        - "电能质量分析"
        - "谐波分析"
      fault_detection:
        - "电机故障"
        - "绝缘老化"
        - "连接松动"
        - "电能质量问题"
        - "谐波污染"
      predictive_indicators:
        - "电流不平衡"
        - "绝缘阻抗"
        - "功率因数"
        - "谐波含量"

      medical_power_criticality:
        medical_grade_power: "医疗级供电"
        life_support_motors: "生命支持电机"
        hvac_motors: "暖通电机"
        backup_power: "备用电源"

    performance_trending:
      monitoring_objects:
        - "整体系统效率"
        - "设备性能参数"
        - "能耗水平"
        - "输出质量"
      diagnostic_technology:
        - "效率计算"
        - "趋势分析"
        - "基准对比"
        - "退化模型"
      performance_tracking:
        - "能源效率"
        - "制冷效率"
        - "风机效率"
        - "泵送效率"
        - "系统整体效率"
      predictive_indicators:
        - "效率下降率"
        - "性能退化指数"
        - "能耗增加率"
        - "基准偏离度"

      medical_efficiency_focus:
        energy_per_patient_bed: "每床位能耗"
        hvac_energy_budget: "暖通空调能效"
        medical_equipment_efficiency: "医疗设备效率"
        cleanroom_energy: "洁净室能耗"

  # 基于AI的智能预测
  ai_driven_prediction:
    machine_learning_models:
      failure_prediction:
        training_data: "历史故障数据和状态数据"
