# 6. 供应室详细规格
central_supply_detailed:

  cssd_workflow:
    principle: "单向流程：污→洁→无菌，不交叉，不倒流"
    workflow_stages:

      stage_1_recycling:
        zone_name: "污车清洗存放区"
        air_classification: "非洁净区"
        pressure: "-10 Pa"
        functions: ["污车接收", "污车清洗", "污车存放"]

      stage_2_sorting:
        zone_name: "污染物品接收分类区"
        air_classification: "清洁区"
        pressure: "-5 Pa"
        functions: ["污染器械清点", "分类分拣", "初步预处理"]

      stage_3_washing:
        zone_name: "全自动器械清洗消毒区"
        air_classification: "清洁区"
        pressure: "0 Pa"
        functions: ["器械清洗", "消毒处理", "初步检查"]
        equipment: ["全自动清洗消毒机", "超声波清洗机", "清洗工作台"]

      stage_4_packaging:
        zone_name: "器械包装灭菌区"
        air_classification: "清洁区"
        pressure: "+5 Pa"
        functions: ["器械检查", "功能测试", "分类包装", "灭菌处理"]
        equipment: ["器械检查台", "包装台", "压力蒸汽灭菌器", "环氧乙烷灭菌器"]

      stage_5_sterilization:
        zone_name: "无菌物品储存发放区"
        air_classification: "洁净区"
        pressure: "+10 Pa"
        functions: ["无菌物品存储", "物品发放", "质量控制"]
        temperature_humidity: "18-28°C，35-75%"

    environmental_requirements:
      temperature_control: "18-28°C"
      humidity_control: "35-75%"
      ventilation: "10-12 次/h"
      pressure_gradients: "高压区→低压区单向流动"
      air_filtration: "H12级别"

    quality_control:
      process_monitoring: ["物理监测", "化学监测", "生物监测"]
      documentation: ["清洗记录", "灭菌记录", "发放记录", "质量追溯"]
      validation: "定期验证清洗灭菌效果"

