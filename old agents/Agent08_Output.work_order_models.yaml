    patient_comfort: "影响患者舒适性"
    no_medical_impact: "无医疗影响"

  business_impact_assessment:
    operation_shutdown: "导致运营停止"
    operation_degraded: "运营能力降级"
    efficiency_reduced: "效率降低"
    cost_increase: "运营成本增加"
    compliance_risk: "合规性风险"
    reputation_risk: "声誉风险"

  priority_criteria:
    high_priority:
      - "影响患者生命安全"
      - "违反法规要求"
      - "主要系统故障"
      - "多个系统受到影响"
