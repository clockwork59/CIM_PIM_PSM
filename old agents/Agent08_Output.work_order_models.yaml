    medium_priority:
      - "影响运营效率"
      - "单系统故障"
      - "预防性维护"
      - "可能导致P1-P2告警"

    low_priority:
      - "轻微影响"
      - "单个设备故障"
      - "改善性建议"
      - "后台系统优化"

