# Agent-05和Agent-07输出文件重构 (Reconstructed Agent05/07 Outputs)
# 基于元数据信息和其他Agent引用的反向推导

# ==== AGENT-05: 系统-空间耦合建模重构 ====
agent_05_reconstructed:

  meta:
    agent_id: "Agent-05"
    agent_name: "系统-空间耦合建模师 (System-Space Coupling Architect)"
    mission: "基于Agent-01、Agent-02、Agent-03的输出，建立系统拓扑-医疗空间-设备本体的全息耦合关系"
    inputs:
      - "Agent-01: 系统拓扑节点和依赖关系"
      - "Agent-02: 医疗空间本体和特殊要求"
      - "Agent-03: 设备本体模型和节点映射"
    reconstruction_basis: "根据Agent-04/06/07/08中对Agent-05输出的引用信息反向推导"
    version: "v1.0-reconstructed"

  # 1. 系统拓扑节点-空间位置耦合
  system_space_coupling:

    hvac_chp_space_mapping:  # 冷源系统空间映射

      main_equipment_locations:
        - equipment: "CH-001 离心式冷水机组"
          location: "BL-MAIN-B1-MR01"  # 主楼地下一层设备机房
          space_type: "MECHANICAL_ROOM"
          environmental_requirements:
            temperature: "5-40°C"
            humidity: "<85%RH"
            ventilation: "换气≥6次/h"
            noise_limit: "≤85dB"
            maintenance_access: "≥1.5m通道"
            equipment_spacing: "≥1.2m"
          coupling_rules:
            thermal: "余热通过排风系统排出"
            vibration: "设备基础减震，管道软连接"
            noise: "机房隔音，设备减震"
            maintenance: "预留检修吊装孔"
            utility: "独立配电，照明充足"

        - equipment: "CT-001 交叉流冷却塔"
          location: "BL-MAIN-ROOF-CT01"  # 主楼屋顶
          space_type: "ROOFTOP_EQUIPMENT"
          environmental_requirements:
            wind_load: "抗风压设计"
            drainage: "有组织排水"
            access: "屋顶设备通道"
            noise_limit: "≤60dB(A)@环境"
            vibration_isolation: "屋顶结构承载"
          coupling_rules:
            structural: "结构承载验算，隔振基础"
            drainage: "冷却水排水系统"
            noise: "风机降噪，隔声屏障"
            ventilation: "保证进排风通畅"
            utility: "屋顶配电防水"

        - equipment: "CHP-PUMP-001 冷冻水泵"
          location: "BL-MAIN-B1-MR01"
          space_type: "MECHANICAL_ROOM"
          positioning_rule: "邻近冷水机组"
          coupling_constraints:
            - "水泵基础标高±0.00m"
            - "吸入端直管段≥5D"
            - "出水端直管段≥3D"
            - "减震垫隔振效率≥85%"

      service_space_relationships:
        - served_space: "BL-MAIN-F3-OR01-OR03"  # 3楼手术室
          equipment: "CH-001"
          service_type: "冷源供应"
          service_path: "CH-001 → CHW-header → AHU-001 → OR zones"
          energy_flow: "冷载体：7/12°C 冷冻水"
          capacity_allocation: "45% of total capacity"
          redundancy_requirement: "N+1"

        - served_space: "BL-MAIN-F5-ICU01"
          equipment: "CH-001"
          service_type: "环境控制"
          service_path: "CH-001 → ICU-AHU → ICU-001"
          criticality_level: "LIFE_SAFETY"
          backup_requirements: "100% backup from CH-002"

    hvac_clean_room_mapping:  # 洁净空调系统映射

      operating_room_coupling:
        - space: "BL-MAIN-F3-OR01"
          cleanliness_class: "ISO 5"
          served_by:
            clean_ahu: "AHU-OR-001 (专用净化机组)"
            air_distribution: "LAF-001 (层流送风天花)"
            hepa_filters: "HEPA-001~004"
            pressure_control: "DP-OR-001 (+18Pa设定)"
          coupling_specifications:
            airflow_pattern: "垂直层流，速度0.15-0.25m/s"
            air_changes: "24 ACH"
            temperature_control: "20-25°C ±1°C"
            humidity_control: "45-55%RH ±5%"
            pressure_gradient: "+18Pa对走廊"
            recovery_time: "≤30min (开关门后)"
            filtration: "三级过滤：初效+中效+高效(99.97%@0.3μm)"
          control_integration: "与AHU-OR-001形成闭环控制"

        - space: "BL-MAIN-F3-OR02"
          cleanliness_class: "ISO 6"
          coupling_constraints:
            - "不得与OR01形成交叉污染"
            - "独立净化机组"
            - "独立压差控制"
            - "专用回风系统"

      icu_coupling:
        - space: "BL-MAIN-F5-ICU01"
          environmental_requirements:
            temperature: "22-26°C"
            humidity: "40-60%RH"
            ventilation: "6-12 ACH"
            filtration: "初效+中效+亚高效"
            noise: "≤45dB(A)"
          equipment_mapping:
            main_ahu: "AHU-ICU-001"
            backup_ahu: "AHU-ICU-002"
            negative_pressure_rooms: "iso-rooms 需要独立系统"
            emergency_ventilation: "E-VEN-ICU-001"

    electrical_space_coupling:

      power_distribution_mapping:
        - equipment: "T-001 主变压器"
          location: "BL-MAIN-B1-SR01"  # 变电站
          space_classification: "HIGH_VOLTAGE_ELECTRICAL"
          safety_requirements:
            - "防火分区独立"
            - "气体灭火保护"
            - "应急照明独立电源"
            - "防小动物措施"
            - "绝缘地垫"
          space_coupling:
            structural_load: "设备重量+变压器油重量"
            heat_rejection: "变压器损耗散热"
            ventilation: "≥15次/h事故排风"
            access: "设备运输和检修通道"
            safety_clearance: "符合GB50054要求"

        - equipment: "LV-SW-001 低压配电柜"
          location: "BL-MAIN-B1-ER01"  # 配电室
          space_requirements:
            room_temp: "≤35°C"
            humidity: "≤75%RH"
            floor_load: "≥5.0kN/m²"
            ceiling_height: "≥3.5m"
            maintenance_access: "前侧≥1.5m，后侧≥1.0m"

      medical_isolated_power_coupling:
        - space: "BL-MAIN-F3-OR01"
          isolated_power: "IPS-OR-001"
          coupling_rules:
            isolation_voltage: "≥5500V AC"
            insulation_monitoring: "实时阻抗监测≥1MΩ"
            fault_location: "双路故障定位"
            backup_isolation: "IPS-OR-002 备用"

    medical_gas_space_coupling:

      surgery_supply:
        - space: "BL-MAIN-F3-OR01"
          gas_supplies:
            - gas: "O2"
              terminal: "O2-OR01-T01"
              flow_rate: "100L/min"
              pressure: "0.4MPa"
              backup: "液氧储罐+汇流排"
            - gas: "VAC"
              terminal: "VAC-OR01-T01"
              vacuum_level: "40-150mmHg"
              flow_rate: "60L/min"
            - gas: "AIR"
              terminal: "ARR-OR01-T01"
              quality: "医疗级无油空气"
              pressure: "0.4MPa"
          distribution_path: "气源→立管→层阀箱→净化管→终端"
          monitoring_integration: "压力监测→DDC→EMS"
          safety_integration: "欠压报警→CCTV→运维"

      icu_supply:
        - space: "BL-MAIN-F5-ICU01"
          critical_gas_systems:
            - oxygen_sockets: "每床5套"
            - vacuum_sockets: "每床5套"
            - medical_air: "每床2套"
          redundancy: "每两套监护病房1路独立供应"
          emergency: "床边应急氧气瓶"

  # 2. 空间约束和接口规范
  space_constraints:

    structural_constraints:
      - constraint_type: "层高限制"
        affected_equipment: ["CT-001", "AHU-large", "T-001"]
        height_requirements:
          - "一般机房≥4.0m"
          - "设备吊装维护空间≥0.8m"
          - "管路上下净距≥0.5m"

      - constraint_type: "楼板承重"
        critical_spaces:
          - space: "BL-MAIN-B1-MR01"
            floor_load: "10.0kN/m²"
            equipment_weights:
              - "CH-001: 8500kg"
              - "CH-002: 8500kg"
              - "水泵组: 1200kg"
          - space: "BL-MAIN-ROOF-CT01"
            floor_load: "15.0kN/m²"
            equipment_weights:
              - "CT-001: 3500kg"
              - "CT-002: 3500kg"

    building_envelope_constraints:
      facade_integration:
        - equipment: "AHU-outdoor"
          constraint: "不得破坏建筑立面"
          solutions: ["骑楼内安装", "百叶围护", "消音处理"]

      roof_integration:
        cooling_towers:
          - location: "主楼屋脊后方隐蔽"
          - enclosure: "与建筑立面协调的隔音屏"
          - discharge: "高空排放，避免回流"

    internal_space_constraints:
      corridor_width: "≥2.4m (病床+推行通道)"
      doorway_width: "≥1.4m (医用气密门)"
      ceiling_height: "≥2.6m (风管安装后)"
      maintenance_access: "关键设备双侧维护"

  # 3. 系统集成接口定义
  system_integration_interfaces:

    bas_integration_points:
      - interface: "DDC-DATA"
        specification: "BACnet IP/Modbus TCP"
        data_points:
          - "温度传感器: AI点"
          - "压差传感器: AI点"
          - "风机状态: BI点"
          - "执行器控制: AO点"
        mapping_rule: "每系统1个网络控制器+10个DDC扩展"

      - interface: "EMS-DATA"
        specification: "OPC UA/RESTful API"
        energy_data:
          - "电能表: 有功电能"
          - "冷量计: 瞬时冷量"
          - "流量计: 累计流量"
        update_frequency: "1分钟批量，15分钟历史"

    medical_systems_integration:
      - system: "医用气体"
        integration_points:
          - point: "压力监测"
            type: "AI=4-20mA"
            interface: "DDC"
          - point: "报警信号"
            type: "DI=干接点"
            interface: "智能照明系统"

      - system: "医技设备"
        interface_spec: "设备厂家提供通信协议"
        data_sharing:
          - "设备发热量计算"
          - "运行时间表分析"
          - "故障统计"

# ==== AGENT-07: 计量体系建模重构 ====
agent_07_reconstructed:

  meta:
    agent_id: "Agent-07"
    agent_name: "计量体系建模师 (Metering System Architect)"
    mission: "基于Agent-01、Agent-03、Agent-05输出，构建能源计量的完整层级结构、分户分项体系和能耗分摊规则"
    reconstruction_basis: "根据Agent-07元数据和Agent-04流动模型反向推导"
    version: "v1.0-reconstructed"

  # 1. 计量层级体系
  metering_hierarchy:

    level_0_total: "院区总表"

    electricity_main_metering:
      - meter_id: "METER-ELEC-L0-001"
        location: "院区高压进线点"
        measurement_point: "35kV主变压器高压侧"
        meter_type: "三相四线多功能电能表"
        accuracy_class: "0.2S级"
        specifications:
          voltage: "35kV/100V (PT)"
          current: "600/5A (CT)"
          functions: ["有功/无功电能", "需量", "功率", "谐波"]
          communication: "光纤+无线双路"
        networking: "主站+集中器+表计三级"
        data_quality: "完整性≥99%，及时率≥99%，准确率≥99.9%"

      - meter_id: "METER-ELEC-L0-002"
        location: "市政备用电源"
        measurement_point: "10kV备用线"
        redundancy: "双路供电计量"

    water_main_metering:
      - meter_id: "METER-WATER-L0-001"
        location: "市政供水总入口"
        meter_type: "电磁流量计"
        accuracy: "±0.2%"
        data_transmission: "NB-IoT无线远传"
        forward_flow_only: true

    gas_main_metering:
      - meter_id: "METER-GAS-L0-001"
        location: "天然气调压站"
        meter_type: "涡轮流量计"
        accuracy: "1.0级"
        pressure_compensation: "温度和压力自动补偿"
        max_flow: "1600m³/h"
        safety: "防爆EX d IIB T4"

    level_1_area: "楼栋/分区总表"

    building_sub_metering:
      - building: "BL-MAIN"
        electricity:
          - meter_id: "METER-ELEC-L1-001"
            location: "主楼低压配电总进线"
            served_area: "主楼1-9F全部"
            accuracy: "0.5S级"
            measurement: "有功电能+需量"

        water:
          - meter_id: "METER-WATER-L1-001"
            location: "地下一层总水表"
            type: "超声波水表"

        heat:
          - meter_id: "METER-HEAT-L1-001"
            location: "冷站计算机热量表"
            measurement: "冷站总冷量输出"
            type: "电磁+温度传感器"

    level_2_subscriber: "科室/病区总表"

    department_metering:

      # 手术部
      surgery_department:
        - meter_id: "METER-ELEC-L2-SUR-001"
          department: "手术部-3F"
          sub_systems: ["洁净空调", "医气系统", "照明", "医用电力"]
          accuracy: "1.0级"
          cost_allocation: "按建筑面积比例分摊"

      # ICU
      icu_department:
        - meter_id: "METER-ELEC-L2-ICU-001"
          department: "ICU-5F"
          critical_systems: ["生命支持设备", "连续监控", "双电源"]
          accuracy: "1.0级"
          backup_metering: "双路计量确保连续性"

      # 医技科室
      radiology_department:
        - meter_id: "METER-ELEC-L2-RAD-001"
          department: "影像科-1F"
          load_profile: "大型医疗设备间歇性大负荷"
          harmonic_monitoring: "X光机、CT、MRI高谐波含量"

    level_3_itemized: "系统/用途分项"

    system_level_metering:

      hvac_systems:
        - system: "冷站系统"
          components:
            - "CHILLER: 电表"
            - "COOLING_TOWER: 电表"
            - "PUMPS: 电表"
            - "TOTAL_COOLING: 冷量表"

        - system: "空调机组"
          air_handling_units:
            - name: "AHU-OR-001"
              point_list:
                - fan_power: "METER-AHU-001-P1"
                - reheat_power: "METER-AHU-001-P2"
                - cooling_coil: "METER-AHU-001-Q1"

      electrical_systems:
        - system: "照明系统"
          lighting_metering:
            - zone: "手术部-3F"
              circuit: "LGT-OR-3F-C1"
              control: "智能照明控制"
              target_energy: "≤15W/m²"

        - system: "医用电力"
          medical_power_metering:
            - equipment: "UPS-OR-001"
              measurement: "输入+输出效率"
              criticality: "P0级"
              monitoring: "1分钟级"

  # 2. 能源介质计量模型
  energy_medium_models:

    electricity_characteristics:
      - medium: "高压电 (35kV)"
        measurement: "直接接入"
        ct_ratio: "600/5A"
        pt_ratio: "35000/100V"
        accuracy: "0.2S"
        frequency: "50Hz"
        burden: "≤2VA"

      - medium: "低压电 (380V)"
        measurement: "CT二次接入"
        ct_ratio: "多样化(100/5~2000/5)"
        accuracy: "0.5S / 1.0"
        installation: "抽屉式电表"

    water_characteristics:
      - medium: "冷水"
        measurement: "速度式(机械/电磁/超声)"
        temperature: "5-30°C"
        pressure: "0.1-1.0MPa"
        accuracy: "2级"

      - medium: "热水"
        measurement: "耐高温流量计"
        temperature: "40-80°C"

    thermal_energy_characteristics:
      - medium: "冷却水"
        calculation: "Q = m × cp × (Treturn - Tsupply)"
        units: "kWh"
        required_measurements:
          - flow_rate
          - supply_temperature
          - return_temperature
          - temperature_difference
        accuracy: "冷量计算±3%"

  # 3. 分摊规则和算法
  allocation_rules:

    hvac_cold_plant_allocation:
      - rule_id: "ALC-CHP-001"
        description: "冷站电耗按冷量使用分摊"
        methodology: "冷量+面积联合分摊"
        algorithm: |
          1. 计算各用户冷量需求占比
             Ratio_chill = Q_user / Q_total
          2. 计算建筑面积占比
             Ratio_area = Area_user / Area_total
          3. 综合分摊比例
             Ratio_allo = 0.7×Ratio_chill + 0.3×Ratio_area
          4. 分摊冷站电耗
             Cost_user = Cost_total × Ratio_allo

      verification_criteria:
        conservation: "分摊后各用户分摊电耗之和 = 冷站总电耗"
        fairness: "同类型用户单位面积分摊差异≤15%"
        traceability: "每次分摊有可追溯计算过程"

    pump_energy_allocation:
      - rule_id: "ALC-PUMP-001"
        description: "冷却/冷冻水泵电耗分摊"
        methodology: "按分摊支路阻力系数+流量联合分摊"

    lighting_energy_allocation:
      - rule_id: "ALC-LGT-001"
        description: "照明用电分摊"
        methodology: "智能照明系统计时分摊"
        features:
          - occupancy_time: "有人时间计费"
          - natural_light: "自然光补偿"
          - work_schedule: "工作作息模式"

    gas_allocation:
      - rule_id: "ALC-GAS-001"
        description: "天然气分摊"
        methodology: "冬季按采暖面积，夏季按生活热水用量"

    common_area_allocation:
      - rule_id: "ALC-COM-001"
        description: "公共区分摊"
        methodology: "按各楼层面积比例分摊"

  # 4. 计量点布置标准
  metering_point_layout:

    design_principles:
      - "总表-分表-子表三级计量"
      - "独立核算单元分户计量"
      - "能耗大户重点计量"
      - "节能评估专项计量"
      - "计量网络完整闭合"

    installation_standards:
      straight_pipe_requirement:
        flow_meter: "前10D后5D"
        orifice_plate: "前15D后5D"
        electromagnetic: "前5D后3D"

      temperature_sensor_installation:
        location: "流体充分混合的直管段"
        protection: "不锈钢套管"
        accuracy: "±0.1°C"

      electrical_meter_connection:
        ct_installation: "远离强磁场"
        polarity: "正确方向"
        grounding: "可靠接地"
        burden: "不超过额定值"

  # 5. 数据质量要求
  metering_data_quality:

    real_time_requirements:
      total_meters: "1分钟采集"
      area_meters: "5分钟采集"
      subscriber_meters: "15分钟采集"
      itemized_meters: "15分钟采集"

    data_integrity:
      completeness: "≥99%"
      timeliness: "数据延迟<30分钟"
      accuracy_verification: "周期校验"
      anomaly_detection: "自动分析"

    communication_relability:
      redundancy: "主备通道"
      offline_storage: "表计本地30天"
      data_recovery: "断点续传"

  # 6. 计量体系集成接口
  system_integration_interfaces:

    bas_interface:
      protocol: "Modbus TCP/BACnet"
      data: "实时计量数据+状态"

    ems_interface:
      protocol: "OPC UA"
      data: "能耗分析+历史数据"

    billing_interface:
      protocol: "RESTful API"
      data: "分户账单+统计分析"

    maintenance_interface:
      protocol: "Web Service"
      data: "设备状态+预警信息"

