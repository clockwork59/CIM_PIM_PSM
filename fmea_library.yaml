        occurrence: 4
        detection: 4
        rpn: 96
        category: "热交换系统"
        symptoms:
          - "冷却/加热能力下降"
          - "进出水温差减小"
          - "空气温差低于设计值"
          - "盘管表面温度不均匀"
          - "冷凝水排放异常"
