# =============================================================================
# FMEA知识库 — 医疗建筑核心设备故障模式分析
# FMEA Knowledge Base for Medical Building MEP Equipment
#
# 基于 ISO 14224 + HVAC行业经验 + Agent-03设备本体模型
# Version: 2.0  |  2026-05-09
# 条目数: 200+
#
# 评分标准 (FMEA方法):
#   Severity (1-10):   1=Minor → 10=Extreme(危及患者安全)
#   Occurrence (1-10):  1=Rare(≤1次/10年) → 10=Very High(≥1次/月)
#   Detection (1-10):   1=Very Easy(自动报警) → 10=Extremely Difficult
#   RPN = Severity × Occurrence × Detection
#   RPN ≥ 100: 立即行动 | 80-99: 优先 | 60-79: 备选 | <60: 监控
#
# 设备分类目录 (按行号快速导航):
#   HVAC: 冷水机组 / AHU / 洁净空调 / VAV / FCU / 冷却塔
#   电气: 变压器 / 发电机 / UPS / 配电柜 / IT隔离电源
#   给排水: 水泵 / 水处理
#   医用气体: LOX站 / 真空泵 / 医用空气压缩机
#   消防: 消防泵
#   其他: HEPA过滤 / BAS楼控 / 电梯
# =============================================================================

FMEA_Library:

