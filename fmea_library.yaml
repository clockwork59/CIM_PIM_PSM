# FMEA知识库 - 医疗建筑核心设备故障模式分析
# 基于 ISO 14224 + HVAC行业经验 + Agent-03设备本体模型
#
# 评分标准 (基于FMEA方法):
# - Severity (1-10): 故障影响严重程度
#   * 10=Extreme: 系统完全失效，危及患者安全
#   * 8-9=Very High: 设备完全停机，影响多个区域
#   * 6-7=High: 性能严重下降，需要立即维修
#   * 4-5=Moderate: 性能下降，可在下次计划维护处理
#   * 2-3=Low: 轻微影响，不影响主要功能
#   * 1=Minor: 无实际影响
#
# - Occurrence (1-10): 故障发生频率
#   * 10=Very High: ≥1次/月
#   * 8-9=High: 1次/3-6个月
#   * 6-7=Moderate: 1次/年
#   * 4-5=Low: 1次/2-3年
#   * 2-3=Very Low: 1次/5-10年
#   * 1=Rare: ≤1次/10年
#
# - Detection (1-10): 故障可检测性
#   * 10=Extremely Difficult: 无法检测，直到灾难性故障
#   * 8-9=Very Difficult: 需要特殊检测设备和长时间
#   * 6-7=Difficult: 需要仪表或经验判断
#   * 4-5=Moderate: 可通过监控系统发现
#   * 2-3=Easy: 明显可见或可测量
#   * 1=Very Easy: 自动报警，实时检测
#
# RPN (Risk Priority Number) = Severity × Occurrence × Detection
# RPN ≥ 100: 需要立即采取行动
# 80 ≤ RPN < 100: 优先处理
# 60 ≤ RPN < 80: 备选处理
# < 60: 可接受，监控即可

FMEA_Library:
  # ===== 冷水机组 (Centrifugal / Screw / Scroll Chiller) =====
  - equipment_type: "离心式冷水机组"
    manufacturer_examples: ["开利 19XR", "约克 YK", "特灵 CVHE"]
    specifications:
      - cooling_capacity: "500-3000 kW"
      - refrigerant: "R134a, R1233zd"
      - power_supply: "380V/3Ph/50Hz"
      - design_life: "20-25年"  # 工业标准值

    failure_modes:
      # 💎 压缩机系统故障
      - failure_id: "CHL-CMP-001"
        failure_mode: "压缩机喘振"
        severity: 9
        occurrence: 3
        detection: 2
        rpn: 54
        category: "压缩机系统"
        symptoms:
          - "异常低频喘鸣声（5-20Hz）"
          - "运行电流剧烈波动（±20%额定值）"
          - "制冷量急剧下降（30-50%）"
          - "振动传感器警报"
          - "冷凝压力快速升高"
        causes:
          - "冷凝器脏污导致冷凝压力过高"
          - "冷却水流量不足或温度过高"
          - "负荷过低（<40%额定负荷）"
          - "制冷剂充注过多"
          - "冷凝器风扇故障"
          - "导叶开度过小"
        immediate_actions:
          - "紧急停止机组，防止机械损坏"
          - "检查冷凝器和冷却塔运行状态"
          - "监测轴承温度"
        maintenance_actions:
          - "清洗冷凝器管束和冷却塔填料"
          - "检查冷却水流量和温度"
          - "调整导叶最小开度设定"
          - "校准制冷剂充注量"
          - "检查并清洁冷凝器"
        prevention:
          - "每月清洗冷凝器"
          - "维持冷却水温度 28-32°C"
          - "避免长时间低负荷运行（<50%）"
          - "安装喘振检测保护装置"
        typical_repair_time: "4-8小时"
        impact_scope: "整个系统停机"

      - failure_id: "CHL-CMP-002"
        failure_mode: "压缩机轴承磨损"
        severity: 8
        occurrence: 2
        detection: 3
        rpn: 48
        category: "压缩机系统"
        symptoms:
          - "轴承温度升高（>85°C）"
          - "振动值增大（>7.1mm/s RMS）"
          - "运行噪音增大（>85dB）"
          - "油液金属颗粒增加"
          - "效率下降"
        causes:
          - "润滑油系统污染或油量不足"
          - "长时间运行在高负荷状态"
          - "制冷剂液体携带（液击）"
          - "轴承质量问题"
          - "润滑不良"
        immediate_actions:
          - "密切监测温度和振动"
          - "准备备机切换"
          - "检查润滑油状态"
        maintenance_actions:
          - "更换轴承组件"
          - "清洗润滑系统"
          - "更换润滑油（清洁度NAS 8级）"
          - "检查油泵和油路"
          - "动平衡校正"
        prevention:
          - "每季度油液分析"
          - "每年更换润滑油"
          - "控制吸气过热度（>5°C）"
          - "安装曲轴箱加热器"
        typical_repair_time: "8-16小时"
        impact_scope: "单机停机"

      - failure_id: "CHL-CMP-003"
        failure_mode: "压缩机电机绕组短路"
        severity: 10
        occurrence: 1
        detection: 8
        rpn: 80
        category: "压缩机系统"
        symptoms:
          - "机组无法启动"
          - "断路器跳闸"
          - "电机烧毁异味"
          - "绝缘电阻<0.5MΩ"
        causes:
          - "电压不平衡（>2%）"
          - "频繁启停"
          - "制冷剂泄漏导致过热"
          - "电机冷却不足"
          - "绕组绝缘老化"
        immediate_actions:
          - "立即断电"
          - "检查供电电压"
          - "检查绝缘电阻"
        maintenance_actions:
          - "电机重绕或更换"
          - "检查电压稳定性"
          - "检查压缩机过热原因"
          - "改善冷却系统"
          - "更换启动装置"
        prevention:
          - "监测相电压不平衡"
          - "限制每小时启动次数（≤6次）"
          - "定期检查绝缘电阻"
          - "保证电机冷却"
        typical_repair_time: "24-48小时"
        impact_scope: "单机长时间停机"

      # 💎 冷凝器系统故障
      - failure_id: "CHL-CDS-001"
        failure_mode: "冷凝器结垢/堵塞"
        severity: 7
        occurrence: 4
        detection: 3
        rpn: 84
        category: "冷凝器系统"
        symptoms:
          - "冷凝压力升高（>1.5的设计压力）"
          - "制冷效率下降（COP下降15-30%）"
          - "压缩机电流增加"
          - "冷凝器进出口温差增大"
          - "冷却水流动阻力增加"
        causes:
          - "冷却水水质差（硬度高）"
          - "水处理不当"
          - "长时间未清洗（>6个月）"
          - "微生物生长"
          - "空气中的灰尘和杂物"
        immediate_actions:
          - "监测冷凝压力"
          - "检查冷却水水质"
          - "临时增加冷却水流量"
        maintenance_actions:
          - "化学清洗（酸洗）冷凝器管束"
          - "机械清洗（海绵球）"
          - "检查和更换水处理剂"
          - "水质化验"
          - "冷却塔清洗"
        prevention:
          - "每月水质化验"
          - "每季度机械清洗"
          - "每年化学清洗"
          - "优化水处理加药"
          - "安装在线清洗装置"
        typical_repair_time: "4-8小时"
        impact_scope: "系统效率下降"

      - failure_id: "CHL-CDS-002"
        failure_mode: "冷却水流量不足"
        severity: 7
        occurrence: 5
        detection: 2
        rpn: 70
        category: "冷凝器系统"
        symptoms:
          - "冷却水流量 < 设计流量的90%"
          - "冷凝压力高"
          - "冷却水泵电流低"
          - "冷却塔水位异常"
        causes:
          - "水泵叶轮磨损"
          - "管路阻塞或阀门未完全打开"
          - "水泵选型偏小"
          - "水系统有空气"
          - "过滤器堵塞"
        immediate_actions:
          - "检查水泵运行状态"
          - "检查管路阀门开度"
          - "检查过滤器"
          - "排气处理"
        maintenance_actions:
          - "清洗或更换水泵叶轮"
          - "清理管路"
          - "更换过滤器"
          - "调整水系统平衡"
          - "水泵更换（如选型错误）"
        prevention:
          - "每周检查水泵电流"
          - "每月清洗过滤器"
          - "定期检查水系统平衡"
          - "水系统排气"
        typical_repair_time: "2-6小时"
        impact_scope: "单机效率下降"

      # 💎 蒸发器系统故障
      - failure_id: "CHL-EVS-001"
        failure_mode: "蒸发器结冰"
        severity: 6
        occurrence: 3
        detection: 2
        rpn: 36
        category: "蒸发器系统"
        symptoms:
          - "蒸发器表面有冰层（视觉检查）"
          - "蒸发压力下降（<3.5 bar）"
          - "制冷量明显下降"
          - "冷冻水出水温度低于设定值"
          - "压缩机吸气温度过低"
        causes:
          - "冷冻水流量过低"
          - "冷冻水温度过低（<6°C）"
          - "制冷剂充注不足"
          - "膨胀阀开度过小"
          - "蒸发器脏堵"
          - "低负荷运行时间过长"
        immediate_actions:
          - "停机化冰"
          - "检查冷冻水流量"
          - "检查制冷剂压力"
        maintenance_actions:
          - "解冻（热水或蒸汽）"
          - "检查并调整冷冻水流量"
          - "校准膨胀阀"
          - "补充制冷剂"
          - "清洗蒸发器"
        prevention:
          - "控制冷冻水出水温度 >6°C"
          - "保证设计流量（>80%）"
          - "避免<40%负荷长时间运行"
          - "安装防冻保护装置"
        typical_repair_time: "2-4小时"
        impact_scope: "单机停机"

      # 💎 制冷剂系统故障
      - failure_id: "CHL-REF-001"
        failure_mode: "制冷剂泄漏"
        severity: 8
        occurrence: 2
        detection: 6
        rpn: 96
        category: "制冷剂系统"
        symptoms:
          - "系统制冷能力下降"
          - "吸气压力低"
          - "压缩机运行时间延长"
          - "视液镜有气泡"
          - "电子检漏仪报警"
          - "冷量不足警报"
        causes:
          - "管路连接处松动"
          - "密封件老化"
          - "管路腐蚀"
          - "维修不当"
          - "振动导致磨损"
        immediate_actions:
          - "查找泄漏点"
          - "监测制冷剂压力"
          - "评估系统冷量"
        maintenance_actions:
          - "使用电子检漏仪定位"
          - "修复泄漏点（焊接或更换）"
          - "系统抽真空"
          - "定量充注制冷剂"
          - "保压测试"
          - "系统性能测试"
        prevention:
          - "每季度检漏"
          - "紧固管路连接"
          - "更换老化密封"
          - "安装泄漏监测系统"
        typical_repair_time: "4-12小时"
        impact_scope: "系统冷量下降"
        environmental_impact: "制冷剂泄漏需环保处理"

      # 💎 润滑油系统故障
      - failure_id: "CHL-OIL-001"
        failure_mode: "润滑油污染或劣化"
        severity: 6
        occurrence: 4
        detection: 4
        rpn: 96
        category: "润滑油系统"
        symptoms:
          - "油液颜色变黑"
          - "油压下降"
          - "油过滤器压差增大"
          - "轴承温度升高"
          - "油分析显示酸值升高"
        causes:
          - "制冷剂携带进入油系统"
          - "水分进入（系统泄漏）"
          - "油冷却器泄漏"
          - "长时间运行未更换"
          - "系统污染"
        immediate_actions:
          - "检查油压"
          - "油液取样分析"
          - "检查油冷却器"
        maintenance_actions:
          - "更换全部润滑油"
          - "清洗油系统"
          - "更换油过滤器"
          - "更换干燥剂"
          - "系统抽真空脱水"
        prevention:
          - "每季度油液分析"
          - "控制制冷剂携带"
          - "防止系统泄漏"
          - "每年更换润滑油"
        typical_repair_time: "4-6小时"
        impact_scope: "润滑系统性能下降"

    failure_statistics:
      # 基于行业平均数据和Agent-08运维日志
      mtbf_hours: 87600  # 平均无故障时间 ~10年
      critical_failures_per_year: 0.5
      common_failures_top5:
        - "冷凝器结垢"
        - "制冷剂泄漏"
        - "压缩机喘振"
        - "冷却水流量异常"
        - "控制系统故障"
      preventive_maintenance_hours: 40  # 年维护工时
      corrective_maintenance_hours: 16   # 年维修工时

  # ===== 空气处理机组 AHU =====
  - equipment_type: "空气处理机组"
    manufacturer_examples: ["美标 TFX", "开利 39M", "特灵 Climate Changer"]
    specifications:
      - air_flow: "2000-50000 m³/h"
      - cooling_capacity: "10-500 kW"
      - heating_capacity: "10-300 kW"
      - power_supply: "380V/3Ph/50Hz"
      - design_life: "15-20年"

    failure_modes:
      - failure_id: "AHU-FAN-001"
        failure_mode: "风机皮带断裂/打滑"
        severity: 7
        occurrence: 5
        detection: 2
        rpn: 70
        category: "风机系统"
        symptoms:
          - "风量显著下降（<80%设计值）"
          - "风机转速降低"
          - "电机空转"
          - "摩擦噪音"
          - "皮带粉尘"
        causes:
          - "皮带老化（橡胶硬化）"
          - "张紧力不当（过紧或过松）"
          - "皮带规格不匹配"
          - "皮带轮不对中"
          - "风机过载"
          - "运行环境温度过高"
        immediate_actions:
          - "停止风机"
          - "检查皮带张紧度"
          - "检查皮带轮对中"
        maintenance_actions:
          - "更换皮带（建议3条同时更换）"
          - "调整张紧力"
          - "对中调整"
          - "清洁皮带轮"
          - "检查整机动平衡"
        prevention:
          - "每季度检查皮带张紧和磨损"
          - "每2年更换皮带"
          - "确保皮带轮对中"
          - "控制过载运行"
          - "改善通风环境"
        typical_repair_time: "1-3小时"
        impact_scope: "风量严重不足"

      - failure_id: "AHU-FAN-002"
        failure_mode: "风机轴承故障"
        severity: 8
        occurrence: 3
        detection: 3
        rpn: 72
        category: "风机系统"
        symptoms:
          - "异常振动（>7.1mm/s RMS）"
          - "轴承温度升高（>80°C）"
          - "尖锐金属摩擦声"
          - "轴封泄漏"
          - "润滑脂泄漏"
        causes:
          - "润滑脂不足或污染"
          - "长期振动运行"
          - "过载运行"
          - "轴承安装不当"
          - "转子不平衡"
          - "轴弯曲"
        immediate_actions:
          - "监测振动和温度"
          - "准备停机"
          - "检查润滑系统"
        maintenance_actions:
          - "更换轴承"
          - "补充或更换润滑脂"
          - "动平衡校正"
          - "检查轴对中"
          - "更换密封件"
        prevention:
          - "每季度振动检测"
          - "定期润滑（每6个月）"
          - "每年动平衡检查"
          - "确保轴对中"
        typical_repair_time: "4-8小时"
        impact_scope: "单机停机"

      # 💎 过滤系统故障
      - failure_id: "AHU-FLT-001"
        failure_mode: "过滤器堵塞"
        severity: 5
        occurrence: 7
        detection: 2
        rpn: 70
        category: "过滤系统"
        symptoms:
          - "过滤器压差增大（>250 Pa）"
          - "风量下降"
          - "风机电流增加"
          - "出风温度异常"
          - "效率下降"
        causes:
          - "过滤器使用超时"
          - "空气质量差（灰尘多）"
          - "过滤器选型偏小"
          - "旁路泄漏"
          - "风速过高"
        immediate_actions:
          - "更换过滤器"
          - "监测压差"
          - "检查旁路"
        maintenance_actions:
