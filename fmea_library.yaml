          - "更换中效过滤器（每3-6个月）"
          - "更换高效过滤器（每1-2年或按压差）"
          - "检查过滤器安装密封"
          - "清洁过滤器框架"
        prevention:
          - "每2周检查初效压差"
          - "每4周检查中效压差"
          - "安装压差报警"
          - "根据实际使用情况调整更换周期"
        typical_repair_time: "0.5-2小时"
        impact_scope: "系统阻力增加"

